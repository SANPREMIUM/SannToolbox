};

TOOL_RENDERERS['drawing-pad'] = (el)=>{
  el.innerHTML = `
    <canvas id="drawCanvas" width="500" height="380"></canvas>
    <div class="row" style="margin-top:10px;">
      <input type="color" id="drColor" value="#f2a541" style="flex:1;">
      <input type="range" id="drSize" min="1" max="30" value="5" style="flex:2;">
    </div>
    <button class="btn secondary" id="drClear" style="margin-top:10px;">🗑️ Bersihkan Kanvas</button>
  `;
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,canvas.width,canvas.height);
  let drawing=false;
  function pos(e){ const r=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:x*canvas.width/r.width, y:y*canvas.height/r.height}; }
  function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle=document.getElementById('drColor').value; ctx.lineWidth=document.getElementById('drSize').value; ctx.lineCap='round'; ctx.stroke(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start,{passive:true}); canvas.addEventListener('touchmove', move,{passive:false}); canvas.addEventListener('touchend', end);
  document.getElementById('drClear').onclick = ()=>{ ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,canvas.width,canvas.height); };
};

TOOL_RENDERERS['piano'] = (el)=>{
  const notes = [261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];
  const labels = ['C','D','E','F','G','A','B','C'];
  el.innerHTML = `<div class="piano">${notes.map((f,i)=>`<div class="piano-key" data-f="${f}">${labels[i]}</div>`).join('')}</div><p class="small-note">Ketuk tuts untuk memainkan nada.</p>`;
  let ctx;
  el.querySelectorAll('.piano-key').forEach(k=>k.addEventListener('touchstart',(e)=>{e.preventDefault();playNote(parseFloat(k.dataset.f));},{passive:false}));
  el.querySelectorAll('.piano-key').forEach(k=>k.addEventListener('mousedown',()=>playNote(parseFloat(k.dataset.f))));
  function playNote(freq){
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=freq; o.type='sine'; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.25,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+0.8);
    o.start(); o.stop(ctx.currentTime+0.8);
  }
};

TOOL_RENDERERS['soundboard'] = (el)=>{
  const sounds = [
    {nm:'Beep',type:'square',freq:800,dur:.15},
    {nm:'Boing',type:'sine',freq:150,dur:.3,slide:400},
    {nm:'Alert',type:'sawtooth',freq:1000,dur:.2},
    {nm:'Klik',type:'square',freq:2000,dur:.05},
    {nm:'Drum',type:'triangle',freq:100,dur:.2},
    {nm:'Laser',type:'sawtooth',freq:1500,dur:.2,slideDown:true},
  ];
  el.innerHTML = `<div class="grid3">${sounds.map((s,i)=>`<button class="btn secondary" data-i="${i}" style="padding:20px 0;">${s.nm}</button>`).join('')}</div>`;
  let ctx;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    const s = sounds[parseInt(b.dataset.i)];
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=s.type; o.frequency.setValueAtTime(s.freq, ctx.currentTime);
    if(s.slide) o.frequency.exponentialRampToValueAtTime(s.slide, ctx.currentTime+s.dur);
    if(s.slideDown) o.frequency.exponentialRampToValueAtTime(s.freq/4, ctx.currentTime+s.dur);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.3,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+s.dur);
    o.start(); o.stop(ctx.currentTime+s.dur);
  });
};

TOOL_RENDERERS['mic-test'] = (el)=>{
  el.innerHTML = `<div class="card" style="text-align:center;"><button class="btn" id="micStart">🎤 Mulai Tes Mikrofon</button><div id="micBarWrap" style="margin-top:16px;display:none;"><div class="xp-bar-bg" style="height:24px;"><div class="xp-bar-fill" id="micBar" style="width:0%;height:100%;"></div></div></div></div>`;
  document.getElementById('micStart').onclick = async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      document.getElementById('micBarWrap').style.display='block';
      document.getElementById('micStart').textContent = '🎤 Mendengarkan...';
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser(); analyser.fftSize=256;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      function loop(){
        analyser.getByteFrequencyData(data);
        const avg = data.reduce((a,b)=>a+b,0)/data.length;
        document.getElementById('micBar').style.width = Math.min(100, avg*1.5)+'%';
        requestAnimationFrame(loop);
      }
      loop();
      addXP(1);
    }catch(e){ toast('Izin mikrofon ditolak atau tidak tersedia'); }
  };
};
