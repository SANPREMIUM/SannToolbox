<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SANN Toolbox</title>
<meta name="description" content="SANN Toolbox — kumpulan tools, kalkulator, game, dan pelacak produktivitas dalam satu aplikasi.">
<meta name="theme-color" content="#0c0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SANN Toolbox">
<link rel="manifest" id="pwaManifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#0c0e13; --surface:#151824; --surface2:#1d2233; --surface3:#252b40;
  --text:#eef0f6; --muted:#8f96ad; --border:#262c40;
  --accent:#f2a541; --accent2:#ff7a45; --good:#4ade80; --bad:#f87171; --info:#60a5fa;
  --radius:18px; --radius-sm:12px;
  --font-display:'Manrope',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
}
body.light{
  --bg:#f3f2ee; --surface:#ffffff; --surface2:#f7f6f2; --surface3:#eceae3;
  --text:#1c1d22; --muted:#6b6f7d; --border:#e3e1d8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  display:flex; justify-content:center; overscroll-behavior:none;
}
#app{width:100%; max-width:560px; min-height:100vh; display:flex; flex-direction:column; position:relative; background:var(--bg);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ===== TOPBAR ===== */
#topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:14px 16px calc(10px + env(safe-area-inset-top)/2); padding-top:calc(14px + env(safe-area-inset-top));
  background:linear-gradient(180deg,var(--bg) 70%,transparent); backdrop-filter:blur(6px);
}
#topbar .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:var(--text);cursor:pointer;}
#topbar .brand{font-family:var(--font-display);font-weight:800;font-size:17px;flex:1;letter-spacing:.2px;display:flex;align-items:center;gap:6px;cursor:pointer;}
#topbar .brand small{font-size:10px;font-weight:600;color:var(--accent);background:rgba(242,165,65,.12);padding:2px 6px;border-radius:6px;}

/* ===== CONTENT ===== */
#content{flex:1; padding:4px 16px 100px; overflow-x:hidden;}
.page{display:none; animation:fadeIn .18s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;}}

h1.page-title{font-family:var(--font-display);font-size:22px;font-weight:800;margin:6px 0 2px;}
p.page-sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5;}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:6px;}
.section-label:first-child{margin-top:0;}

/* search */
.search-wrap{position:relative;margin:6px 0 8px;}
.search-wrap input{width:100%;padding:13px 14px 13px 40px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none;}
.search-wrap span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6;}
.search-wrap input:focus{border-color:var(--accent);}

/* category grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px;cursor:pointer;transition:.15s;}
.cat-card:active{transform:scale(.97);background:var(--surface2);}
.cat-card .em{font-size:26px;display:block;margin-bottom:8px;}
.cat-card .nm{font-weight:700;font-size:14px;}
.cat-card .ct{font-size:11px;color:var(--muted);margin-top:2px;}

/* tool list */
.tool-list{display:flex;flex-direction:column;gap:8px;}
.tool-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;transition:.12s;}
.tool-row:active{background:var(--surface2);transform:scale(.985);}
.tool-row .em{font-size:20px;width:30px;text-align:center;flex-shrink:0;}
.tool-row .tx{flex:1;min-width:0;}
.tool-row .tx .nm{font-weight:700;font-size:14px;}
.tool-row .tx .ds{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4;}
.tool-row .chev{color:var(--muted);flex-shrink:0;}
.tool-row .pin-btn{font-size:16px;padding:4px;flex-shrink:0;opacity:.55;}
.tool-row .pin-btn.active{opacity:1;}

/* row scroller (horizontal) */
.h-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;}
.h-scroll::-webkit-scrollbar{display:none;}
.mini-card{flex-shrink:0;width:118px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;}
.mini-card .em{font-size:20px;}
.mini-card .nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.3;}

/* generic card / panel */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card + .card{margin-top:0;}
.row{display:flex;gap:10px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.col{display:flex;flex-direction:column;gap:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}

label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=email],select,textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14.5px;outline:none;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:80px;}
input[type=range]{width:100%;accent-color:var(--accent);}
input[type=color]{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);padding:2px;}

.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}

.btn{background:var(--accent);color:#1a1206;border:none;padding:13px 18px;border-radius:13px;font-weight:800;font-size:14.5px;cursor:pointer;text-align:center;width:100%;}
.btn:active{transform:scale(.97);}
.btn.secondary{background:var(--surface3);color:var(--text);}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.danger{background:var(--bad);color:#2a0a0a;}
.btn.sm{padding:9px 14px;font-size:13px;width:auto;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}

.result-box{background:var(--surface2);border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center;margin-top:12px;}
.result-box .big{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--accent);word-break:break-all;}
.result-box .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}

.chip{display:inline-flex;align-items:center;padding:7px 13px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer;}
.chip.active{background:var(--accent);color:#1a1206;border-color:var(--accent);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}

.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(242,165,65,.15);color:var(--accent);}

/* keypad calc */
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.key{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px 0;text-align:center;font-size:17px;font-weight:600;cursor:pointer;font-family:var(--font-mono);}
.key:active{background:var(--surface3);}
.key.op{color:var(--accent);}
.key.eq{background:var(--accent);color:#1a1206;}
.calc-screen{background:var(--surface2);border-radius:14px;padding:18px 14px;text-align:right;margin-bottom:4px;}
.calc-screen .expr{color:var(--muted);font-size:13px;min-height:16px;font-family:var(--font-mono);word-break:break-all;}
.calc-screen .val{font-size:32px;font-weight:700;font-family:var(--font-mono);word-break:break-all;}

/* stopwatch/timer */
.timer-display{font-family:var(--font-mono);font-size:52px;font-weight:700;text-align:center;padding:30px 0 10px;letter-spacing:1px;}
.timer-display.sm{font-size:38px;}
.ring-wrap{display:flex;justify-content:center;padding:10px 0;}

/* toggle switch */
.switch{position:relative;width:46px;height:26px;background:var(--surface3);border-radius:20px;cursor:pointer;flex-shrink:0;transition:.2s;}
.switch.on{background:var(--accent);}
.switch .dot{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;}
.switch.on .dot{left:23px;}

/* list items */
.li-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:8px;}
.li-row .li-tx{flex:1;font-size:14px;}
.li-row .li-tx.done{text-decoration:line-through;color:var(--muted);}
.li-row .li-del{color:var(--bad);cursor:pointer;font-size:16px;padding:4px;}
.li-row.clickable{cursor:pointer;transition:.12s;}
.li-row.clickable:active{background:var(--surface3);transform:scale(.99);}
.checkbox{width:20px;height:20px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;}
.checkbox.checked{background:var(--good);border-color:var(--good);}

/* profil publik & chat */
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#1a1206;margin:0 auto 10px;position:relative;}

/* status online */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.status-dot.online{background:var(--good);box-shadow:0 0 0 3px rgba(74,222,128,.18);}
.status-text{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.status-text.online{color:var(--good);font-weight:700;}
.profile-avatar .status-dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;border:2px solid var(--surface);box-shadow:none;}
.profile-avatar .status-dot.online{box-shadow:none;}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:340px;}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px;}
.chat-bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;}
.chat-bubble.me{align-self:flex-end;background:var(--accent);color:#1a1206;border-bottom-right-radius:4px;}
.chat-bubble.them{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.chat-bubble .t{font-size:9.5px;opacity:.6;margin-top:3px;text-align:right;}
.chat-inputbar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
.chat-inputbar input{flex:1;margin-bottom:0;}
.chat-inputbar button{width:auto;padding:11px 18px;flex-shrink:0;}

/* game board helpers */
.ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:14px auto;}
.ttt-cell{aspect-ratio:1;background:var(--surface2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;cursor:pointer;}
.mem-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:10px auto;}
.mem-cell{aspect-ratio:1;background:var(--surface2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;user-select:none;}
.mem-cell.flip{background:var(--surface3);}
.mem-cell.matched{background:rgba(74,222,128,.2);}
.g2048-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:10px auto;background:var(--surface2);padding:8px;border-radius:14px;}
.g2048-cell{aspect-ratio:1;background:var(--surface3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
.simon-board{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:260px;margin:14px auto;}
.simon-pad{aspect-ratio:1;border-radius:16px;opacity:.5;cursor:pointer;}
.simon-pad.lit{opacity:1;}
.puzzle-board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:300px;margin:10px auto;}
.puzzle-cell{aspect-ratio:1;background:var(--accent);color:#1a1206;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;cursor:pointer;}
.puzzle-cell.empty{background:var(--surface2);}
.sudoku-board{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    width:100%;
    max-width:360px;
    margin:10px auto;
    background:#9A7B00;
    border:3px solid #facc15;
    gap:0;
    overflow:hidden;
    border-radius:8px;
}

.sudoku-cell{
    aspect-ratio:1;
    background:#000;
    border-right:2px solid #9A7B00;
    border-bottom:2px solid #9A7B00;
    box-sizing:border-box;
}

/* Garis pemisah blok 3×3 - KUNING */
.sudoku-cell:nth-child(3n){
    border-right:4px solid #facc15
}

.sudoku-cell:nth-child(n+19):nth-child(-n+27),
.sudoku-cell:nth-child(n+46):nth-child(-n+54){
    border-bottom:4px solid #facc15;
}

/* Sisi kanan */
.sudoku-cell:nth-child(9n){
    border-right:none;
}

/* Sisi bawah */
.sudoku-cell:nth-child(n+73){
    border-bottom:none;
}

.sudoku-cell input{
    width:100%;
    height:100%;
    box-sizing:border-box;
    padding:0;
    margin:0;
    border:none;
    outline:none;
    text-align:center;
    font-weight:800;
    font-size:17px;
    background:#000;
    color:#fff;
}

.sudoku-cell input[readonly]{
    background:#000 !important;
    color:#fff !important;
    opacity:1 !important;
}
#snakeCanvas,#drawCanvas{width:100%;background:var(--surface2);border-radius:14px;touch-action:none;}
.tsb-wrap{position:relative;width:100%;aspect-ratio:5/7;max-height:70vh;border-radius:16px;overflow:hidden;background:#000;margin:8px 0;}
.tsb-wrap canvas{display:block;width:100%;height:100%;touch-action:none;}
.tsb-hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none;z-index:3;}
.tsb-score{font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);}
.tsb-best{font-size:11px;font-weight:700;color:var(--accent);background:rgba(0,0,0,.35);padding:4px 9px;border-radius:20px;}
.tsb-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5;padding:16px;background:rgba(10,14,26,.72);}
.tsb-overlay.hide{display:none;}
.tsb-overlay .em{font-size:44px;margin-bottom:4px;}
.tsb-overlay h3{font-size:20px;margin:0 0 4px;color:#fff;}
.tsb-overlay p{color:#c7cbdb;font-size:12.5px;margin:0 0 14px;max-width:240px;line-height:1.5;}
.tsb-overlay .stat-row{background:rgba(255,255,255,.08);margin-bottom:14px;}
.tsb-overlay .stat-row .s b{color:var(--accent);}
.tsb-overlay .stat-row .s span{color:#c7cbdb;}
.tsb-play{background:linear-gradient(180deg,var(--accent),#f0a93a);color:#2a1b02;border:none;padding:13px 32px;border-radius:30px;font-weight:800;font-size:14.5px;cursor:pointer;}
.tsb-play:active{transform:scale(.96);}
.tsb-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:11px;font-weight:600;z-index:2;pointer-events:none;}

/* stat row */
.stat-row{display:flex;justify-content:space-between;text-align:center;background:var(--surface2);border-radius:14px;padding:14px 8px;margin-bottom:14px;}
.stat-row .s{flex:1;}
.stat-row .s b{display:block;font-size:18px;font-weight:800;color:var(--accent);}
.stat-row .s span{font-size:10.5px;color:var(--muted);}

/* achievement */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ach-card{background:var(--surface2);border-radius:14px;padding:12px;text-align:center;opacity:.35;}
.ach-card.unlocked{opacity:1;background:rgba(242,165,65,.1);border:1px solid var(--accent);}
.ach-card .em{font-size:22px;}
.ach-card .nm{font-size:11px;font-weight:700;margin-top:4px;}

/* xp bar */
.xp-bar-bg{height:10px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:8px;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:.3s;}

/* flashcard */
.flashcard{background:var(--surface2);border-radius:20px;padding:40px 20px;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:14px 0;}
.flashcard .main{font-size:28px;font-weight:800;}
.flashcard .sub{font-size:14px;color:var(--muted);margin-top:8px;}

/* toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* bottom nav */
#bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;}
#bottomnav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted);font-size:10px;font-weight:700;}
#bottomnav .bn-item.active{color:var(--accent);}
#bottomnav .bn-item .em{font-size:19px;}

/* full menu drawer */
#menuOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;}
#menuOverlay.show{display:block;}
#menuDrawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:340px;background:var(--surface);z-index:91;transform:translateX(-105%);transition:.25s;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 20px;}
#menuDrawer.show{transform:translateX(0);}
.menu-cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:18px 0 8px;padding-left:4px;}
.menu-cat:first-child{margin-top:0;}
.menu-item{padding:10px 8px;border-radius:10px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.menu-item:active{background:var(--surface2);}

.empty-state{text-align:center;padding:40px 10px;color:var(--muted);}
.empty-state .em{font-size:36px;display:block;margin-bottom:10px;}

.back-link{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:8px;cursor:pointer;}

.qr-preview{background:#fff;padding:16px;border-radius:14px;display:flex;justify-content:center;margin:14px 0;}

.weather-hero{text-align:center;padding:10px 0 4px;}
.weather-hero .temp{font-size:52px;font-weight:800;font-family:var(--font-display);}
.weather-hero .desc{color:var(--muted);font-size:14px;margin-top:2px;}
.weather-hero .loc{font-weight:700;font-size:15px;margin-top:8px;}

.piano{display:flex;gap:3px;margin-top:14px;overflow-x:auto;}

<script>
/* ============================================================
   SANN TOOLBOX — single file app
   ============================================================ */

/* ---------- PWA manifest (dibuat inline agar tetap 1 file) ---------- */
(function setupManifest(){
  try{
    const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230c0e13"/><text x="50" y="66" font-size="56" text-anchor="middle">🧰</text></svg>'.replace(/%23/g,'#'));
    const manifest = {
      name: 'SANN Toolbox',
      short_name: 'SANN',
      start_url: location.pathname,
      display: 'standalone',
      background_color: '#0c0e13',
      theme_color: '#0c0e13',
      icons: [{ src: icon, sizes: '100x100', type: 'image/svg+xml' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    document.getElementById('pwaManifest').href = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'icon'; link.href = icon;
    document.head.appendChild(link);
  }catch(e){ /* tidak kritikal kalau gagal */ }
})();

/* ---------- storage helpers ---------- */
const DB = {
  get(k, d){ try{ const v = localStorage.getItem('sann_'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('sann_'+k, JSON.stringify(v)); }catch(e){} }
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 1800);
}
function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }
function copyText(txt){
  navigator.clipboard && navigator.clipboard.writeText(txt).then(()=>toast('Disalin ke clipboard ✅')).catch(()=>toast('Gagal menyalin'));
}
function fmtNum(n, d=2){ if(isNaN(n)) return '-'; return Number(n).toLocaleString('id-ID',{maximumFractionDigits:d}); }
function pad(n){ return n.toString().padStart(2,'0'); }

/* ---------- theme ---------- */
function initTheme(){
  const t = DB.get('theme','dark');
  document.body.classList.toggle('light', t==='light');
  document.getElementById('themeBtn').textContent = t==='light' ? '☀️' : '🌙';
  const accent = DB.get('accent', '#f2a541');
  document.documentElement.style.setProperty('--accent', accent);
  try {
    const r = parseInt(accent.slice(1,3),16), g = parseInt(accent.slice(3,5),16), b = parseInt(accent.slice(5,7),16);
    const lighten = (c) => Math.min(255, Math.round(c + (255-c)*0.25));
    const a2 = '#' + [lighten(r),lighten(g),lighten(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    document.documentElement.style.setProperty('--accent2', a2);
  } catch(e) {
    document.documentElement.style.setProperty('--accent2', accent);
  }
}
function toggleTheme(){
  const cur = DB.get('theme','dark');
  const nw = cur==='light' ? 'dark':'light';
  DB.set('theme', nw); initTheme();
}
function setAccent(hex){
  if(!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  DB.set('accent', hex);
  document.documentElement.style.setProperty('--accent', hex);
  try {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const lighten = (c) => Math.min(255, Math.round(c + (255-c)*0.25));
    const a2 = '#' + [lighten(r),lighten(g),lighten(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    document.documentElement.style.setProperty('--accent2', a2);
  } catch(e) {
    document.documentElement.style.setProperty('--accent2', hex);
  }
  toast('Warna aksen diperbarui ✅');
}

/* ---------- XP / streak / achievements ---------- */
const ACHIEVEMENTS = [
  {id:'first_tool', em:'🎯', nm:'Langkah Pertama', desc:'Gunakan 1 tools', check:s=>s.toolsUsed>=1},
  {id:'ten_tool', em:'🧰', nm:'Kolektor Tools', desc:'Gunakan 10 tools berbeda', check:s=>Object.keys(s.usedList||{}).length>=10},
  {id:'streak3', em:'🔥', nm:'Konsisten', desc:'Streak 3 hari', check:s=>s.streak>=3},
  {id:'streak7', em:'🔥', nm:'Seminggu Penuh', desc:'Streak 7 hari', check:s=>s.streak>=7},
  {id:'lvl5', em:'⭐', nm:'Level 5', desc:'Mencapai level 5', check:s=>calcLevel(s.xp).level>=5},
  {id:'lvl10', em:'🏆', nm:'Level 10', desc:'Mencapai level 10', check:s=>calcLevel(s.xp).level>=10},
  {id:'game_win', em:'🎮', nm:'Gamer Sejati', desc:'Menangkan 1 game', check:s=>s.gamesWon>=1},
  {id:'game_win10', em:'👑', nm:'Juara', desc:'Menangkan 10 game', check:s=>s.gamesWon>=10},
  {id:'note_taker', em:'📝', nm:'Pencatat', desc:'Buat 5 catatan', check:s=>s.notesMade>=5},
  {id:'todo_10', em:'✅', nm:'Produktif', desc:'Selesaikan 10 todo', check:s=>s.todosDone>=10},
];
function calcLevel(xp){
  let level=1, need=100, total=0;
  while(xp >= total+need){ total+=need; level++; need=Math.round(need*1.25); }
  return {level, cur:xp-total, need};
}
function getProfile(){
  return DB.get('profile', {xp:0, streak:0, lastDay:'', toolsUsed:0, usedList:{}, gamesWon:0, notesMade:0, todosDone:0, unlocked:{}});
}
function saveProfile(p){ DB.set('profile', p); }
function addXP(amount, reason){
  const p = getProfile();
  p.xp += amount;
  const today = new Date().toDateString();
  if(p.lastDay !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    p.streak = (p.lastDay === y.toDateString()) ? (p.streak||0)+1 : 1;
    p.lastDay = today;
  }
  saveProfile(p);
  const _uname = currentUsername();
  if(_uname){
    fsUpdateScore(_uname, amount); // update skor global di Firestore
  }
  checkAchievements();
  updateLevelBadge();
  if(reason) toast('+'+amount+' XP · '+reason);
}
function markToolUsed(id, nm){
  const p = getProfile();
  if(!p.usedList[id]){ p.toolsUsed++; }
  p.usedList[id] = Date.now();
  saveProfile(p);
  let recent = DB.get('recent', []);
  recent = recent.filter(r=>r.id!==id);
  recent.unshift({id, nm, t:Date.now()});
  DB.set('recent', recent.slice(0,10));
  if(id.startsWith('g-')){
    const gp = DB.get('gamePlays', {});
    gp[id] = (gp[id]||0)+1;
    DB.set('gamePlays', gp);
    const _uname = currentUsername();
    if(_uname) fsIncrementGamePlay(_uname, id);
  }
  addXP(2);
}
function checkAchievements(){
  const p = getProfile();
  let newly = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!p.unlocked[a.id] && a.check(p)){ p.unlocked[a.id]=true; newly.push(a); }
  });
  if(newly.length){ saveProfile(p); setTimeout(()=>toast('🏆 Achievement: '+newly[0].nm), 400); }
}
function updateLevelBadge(){
  const p = getProfile();
  document.getElementById('lvlBadge').textContent = 'Lv'+calcLevel(p.xp).level;
}

/* ---------- favorites ---------- */
function getFavs(){ return DB.get('favs', []); }
function toggleFav(id){
  let f = getFavs();
  if(f.includes(id)){ f = f.filter(x=>x!==id); toast('Dihapus dari favorit'); }
  else { f.push(id); toast('Ditambahkan ke favorit ⭐'); }
  DB.set('favs', f);
  render();
}

/* ============================================================
   FIREBASE INIT + AUTH
   Password TIDAK PERNAH disimpan/dibandingkan sendiri di sini.
   Semua kredensial ditangani oleh Firebase Authentication
   (hashing + salting dilakukan di server Google, bukan di JS ini).

   dengan Firebase Auth berbasis email/password.

const firebaseConfig = {
  apiKey: "AIzaSyCsXURFRDeEzRXZLe9zYyjh0-1yD6LAlcA",
  authDomain: "sann-tools-2c22e.firebaseapp.com",
  projectId: "sann-tools-2c22e",
  storageBucket: "sann-tools-2c22e.firebasestorage.app",

};
/* Catatan: apiKey Firebase di atas BUKAN rahasia — Google mendesainnya
   untuk terlihat publik di kode client. Yang menjaga keamanan datamu
   adalah Firestore Security Rules (lihat firestore.rules yang dibuatkan
   terpisah) dan Firebase Authentication, bukan menyembunyikan apiKey ini. */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});

function usernameToPseudoEmail(u){ return u.toLowerCase()+'@users.sanntoolbox.app'; }
function currentUsername(){ return sessionStorage.getItem('sann_session_user') || null; }
function isAdminSession(){ return sessionStorage.getItem('sann_session_admin') === '1'; }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* Firestore helpers */
async function fsGetUser(username){
  try{
    const snap = await db.collection('users').doc(username).get();
    return snap.exists ? { id: snap.id, ...snap.data() } : null;
  }catch(e){ console.error(e); return null; }
}
async function fsCreateUser(username, score){
  await db.collection('users').doc(username).set({
    score: score || 0,
    isAdmin: false,
    createdAt: new Date().toDateString(),
    createdAtTs: firebase.firestore.FieldValue.serverTimestamp()
  });
}
async function fsUpdateScore(username, amount){
  if(!username) return;
  try{
    await db.collection('users').doc(username).update({
      score: firebase.firestore.FieldValue.increment(amount)
    });
  }catch(e){ console.error('Gagal update skor:', e); }
}
async function fsGetAllUsers(){
  try{
    const snap = await db.collection('users').orderBy('score','desc').get();
    return snap.docs.map(d => ({ u: d.id, ...d.data() }));
  }catch(e){
    console.error(e);
    // fallback tanpa orderBy (kalau index belum ada)
    try{
      const snap2 = await db.collection('users').get();
      return snap2.docs.map(d => ({ u: d.id, ...d.data() })).sort((a,b)=>(b.score||0)-(a.score||0));
    }catch(e2){ return []; }
  }
}
async function fsCountUsers(){
  try{
    const snap = await db.collection('users').get();
    return snap.size;
  }catch(e){ return 0; }
}
async function fsIncrementGamePlay(username, gameId){
  if(!username) return;
  try{
    await db.collection('users').doc(username).update({
      ['gamePlays.'+gameId]: firebase.firestore.FieldValue.increment(1)
    });
  }catch(e){ console.error('Gagal update gamePlays:', e); }
}

/* ---------- status online (presence) ----------
   Tidak pakai kamera/mikrofon/lokasi — hanya menandai waktu aktif
   terakhir user di Firestore, lalu dibandingkan dengan waktu sekarang. */
const ONLINE_THRESHOLD_MS = 45000; // dianggap online jika heartbeat < 45 detik lalu
function isUserOnline(rec){
  if(!rec || !rec.lastActive || typeof rec.lastActive.toMillis !== 'function') return false;
  return (Date.now() - rec.lastActive.toMillis()) < ONLINE_THRESHOLD_MS;
}
let _presenceInterval = null;
async function fsHeartbeat(){
  const me = currentUsername();
  if(!me) return;
  try{
    await db.collection('users').doc(me).update({
      lastActive: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ /* diamkan, tidak kritikal */ }
}
function onVisibilityChangePresence(){
  if(document.visibilityState === 'visible') fsHeartbeat();
}
function startPresence(){
  stopPresence();
  fsHeartbeat();
  _presenceInterval = setInterval(fsHeartbeat, 20000);
  document.addEventListener('visibilitychange', onVisibilityChangePresence);
  window.addEventListener('focus', fsHeartbeat);
}
function stopPresence(){
  if(_presenceInterval){ clearInterval(_presenceInterval); _presenceInterval=null; }
  document.removeEventListener('visibilitychange', onVisibilityChangePresence);
  window.removeEventListener('focus', fsHeartbeat);
}
function chatIdFor(a,b){ return [a,b].sort().join('__'); }
async function fsSendMessage(otherUser, text){
  const me = currentUsername();
  if(!me || !otherUser || me===otherUser || !text.trim()) return;
  const chatId = chatIdFor(me, otherUser);
  await db.collection('chats').doc(chatId).set({
    participants: [me, otherUser].sort(),
    lastText: text.slice(0,120),
    lastFrom: me,
    lastTs: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});
  await db.collection('chats').doc(chatId).collection('messages').add({
    from: me,
    text: text.slice(0,1000),
    ts: firebase.firestore.FieldValue.serverTimestamp()
  });
}

let gateView = 'welcome';
let _gateLoading = false;

function initAuthGate(){
  const overlay = document.getElementById('gateOverlay');
  // Sumber kebenaran sesi = Firebase Auth, bukan sekadar sessionStorage.
  // Ini mencegah UI "terasa login" padahal token Firebase-nya sudah tidak valid.
  auth.onAuthStateChanged(async (user)=>{
    const savedUser = sessionStorage.getItem('sann_session_user');
    if(user && savedUser){
      overlay.style.display = 'none';
      startPresence();
    } else {
      stopPresence();
      sessionStorage.removeItem('sann_session_user');
      sessionStorage.removeItem('sann_session_admin');
      gateView = 'welcome';
      drawGate();
      overlay.style.display = 'flex';
    }
  });
}

async function drawGate(msg){
  const box = document.getElementById('gateBox');
  const totalTools = allTools().length;

  if(gateView === 'welcome'){
    box.innerHTML = `
      <div class="gate-title">SELAMAT DATANG<br>DI SANN TOOLS</div>
      <div class="gate-stats">
        <div class="gs-item"><b id="gateUserCount">...</b><span>Pengguna Terdaftar</span></div>
        <div class="gs-item"><b>${totalTools}</b><span>Tools Tersedia</span></div>
      </div>
      <div class="gate-btn-row">
        <button class="gate-btn login" onclick="gateView='login';drawGate();">Login</button>
        <button class="gate-btn daftar" onclick="gateView='register';drawGate();">Daftar</button>
      </div>
      <div class="gate-note">Jika tidak punya akun, silahkan daftar dulu.<br>Akun tersimpan di cloud (multi-perangkat).</div>
    `;
    fsCountUsers().then(n=>{
      const el = document.getElementById('gateUserCount');
      if(el) el.textContent = n;
    });
  } else if(gateView === 'login'){
    box.innerHTML = `
      <div class="gate-back" onclick="gateView='welcome';drawGate();">← Kembali</div>
      <div class="gate-title sm">Masuk ke Akun</div>
      <div class="field"><label>Username</label><input type="text" id="gtLoginUser" placeholder="Masukkan username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="gtLoginPass" placeholder="Masukkan password" autocomplete="current-password"></div>
      ${msg?`<div class="gate-error">${msg}</div>`:''}
      <button class="btn" style="margin-top:10px;" id="btnDoLogin" onclick="doLogin()">Login</button>
      <div class="gate-switch">Belum punya akun? <b onclick="gateView='register';drawGate();">Daftar</b></div>
    `;
  } else if(gateView === 'register'){
    box.innerHTML = `
      <div class="gate-back" onclick="gateView='welcome';drawGate();">← Kembali</div>
      <div class="gate-title sm">Buat Akun Baru</div>
      <div class="field"><label>Username</label><input type="text" id="gtRegUser" placeholder="Pilih username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="gtRegPass" placeholder="Buat password" autocomplete="new-password"></div>
      <div class="field"><label>Ulang Password</label><input type="password" id="gtRegPass2" placeholder="Ketik ulang password" autocomplete="new-password"></div>
      ${msg?`<div class="gate-error">${msg}</div>`:''}
      <button class="btn" style="margin-top:10px;" id="btnDoRegister" onclick="doRegister()">Daftar</button>
      <div class="gate-switch">Sudah punya akun? <b onclick="gateView='login';drawGate();">Login</b></div>
    `;
  } else if(gateView === 'adminWelcome'){
    box.innerHTML = `
      <div class="gate-title">Selamat Datang<br>Kembali Sandrian</div>
      <div class="gate-stats">
        <div class="gs-item"><b id="adminRegToday">...</b><span>User Daftar Hari Ini</span></div>
        <div class="gs-item"><b id="adminTotalUsers">...</b><span>Total User Sekarang</span></div>
      </div>
      <button class="btn" onclick="enterApp()">Masuk ke Toolbox</button>
    `;
    fsGetAllUsers().then(list=>{
      const today = new Date().toDateString();
      const regToday = list.filter(u=>u.createdAt===today).length;
      const el1 = document.getElementById('adminRegToday');
      const el2 = document.getElementById('adminTotalUsers');
      if(el1) el1.textContent = regToday;
      if(el2) el2.textContent = list.length;
    });
  }
  const first = box.querySelector('input');
  if(first) setTimeout(()=>first.focus(), 50);
}

/* Login & register memakai Firebase Authentication asli.
   Password TIDAK PERNAH kita baca/bandingkan sendiri — auth.signInWith...
   mengirim kredensial langsung ke server Firebase lewat koneksi terenkripsi,
   dan Firebase yang memverifikasinya. Kode ini tidak pernah melihat/menyimpan
   hash password siapa pun. */
async function doLogin(){
  if(_gateLoading) return;
  const u = document.getElementById('gtLoginUser').value.trim();
  const pw = document.getElementById('gtLoginPass').value;
  if(!u || !pw){ drawGate('Username dan password wajib diisi.'); return; }

  const btn = document.getElementById('btnDoLogin');
  if(btn){ btn.disabled = true; btn.textContent = 'Memeriksa...'; }
  _gateLoading = true;

  try{
    await auth.signInWithEmailAndPassword(usernameToPseudoEmail(u), pw);
    const rec = await fsGetUser(u);
    sessionStorage.setItem('sann_session_user', u);
    if(rec && rec.isAdmin === true){
      sessionStorage.setItem('sann_session_admin', '1');
      toast('Selamat datang kembali, '+u+'! 👋');
      gateView = 'adminWelcome';
      drawGate();
      return;
    }
    toast('Selamat datang kembali, '+u+'! 👋');
    enterApp();
  }catch(e){
    console.error(e);
    if(e.code==='auth/user-not-found' || e.code==='auth/wrong-password' || e.code==='auth/invalid-credential'){
      drawGate('Username atau password salah.');
    } else if(e.code==='auth/too-many-requests'){
      drawGate('Terlalu banyak percobaan gagal. Coba lagi sebentar lagi.');
    } else {
      drawGate('Gagal terhubung ke server. Cek internet lalu coba lagi.');
    }
  }finally{
    _gateLoading = false;
  }
}

async function doRegister(){
  if(_gateLoading) return;
  const u = document.getElementById('gtRegUser').value.trim();
  const pw = document.getElementById('gtRegPass').value;
  const pw2 = document.getElementById('gtRegPass2').value;
  if(!u || !pw || !pw2){ drawGate('Semua kolom wajib diisi.'); return; }
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(u)){ drawGate('Username 3-20 karakter, hanya huruf/angka/underscore.'); return; }
  if(pw.length < 6){ drawGate('Password minimal 6 karakter.'); return; }
  if(pw !== pw2){ drawGate('Password dan ulang password tidak sama.'); return; }

  const btn = document.getElementById('btnDoRegister');
  if(btn){ btn.disabled = true; btn.textContent = 'Mendaftar...'; }
  _gateLoading = true;

  try{
    const existing = await fsGetUser(u);
    if(existing){ drawGate('Username sudah dipakai, pilih yang lain.'); return; }

    await auth.createUserWithEmailAndPassword(usernameToPseudoEmail(u), pw);
    const existingXP = getProfile().xp || 0;
    await fsCreateUser(u, existingXP);
    sessionStorage.setItem('sann_session_user', u);
    toast('Akun berhasil dibuat! Selamat datang, '+u+' 🎉');
    enterApp();
  }catch(e){
    console.error(e);
    if(e.code==='auth/email-already-in-use'){
      drawGate('Username sudah dipakai, pilih yang lain.');
    } else if(e.code==='auth/weak-password'){
      drawGate('Password terlalu lemah, minimal 6 karakter.');
    } else {
      drawGate('Gagal mendaftar. Cek internet / pengaturan Firebase lalu coba lagi.');
    }
  }finally{
    _gateLoading = false;
  }
}

function enterApp(){
  document.getElementById('gateOverlay').style.display = 'none';
  startPresence();
  render();
}

function logout(){
  stopPresence();
  sessionStorage.removeItem('sann_session_user');
  sessionStorage.removeItem('sann_session_admin');
  auth.signOut().finally(()=>location.reload());
}

function renderUserProfileBody(username, rec){
  const body = document.getElementById('upBody');
  if(!body) return;
  try{
    let daysActive = 1;
    let created = null;
    if(rec.createdAtTs && typeof rec.createdAtTs.toDate === 'function') created = rec.createdAtTs.toDate();
    else if(rec.createdAt) created = new Date(rec.createdAt);
    if(created && !isNaN(created.getTime())){
      daysActive = Math.max(1, Math.floor((Date.now()-created.getTime())/86400000)+1);
    }
    const gp = rec.gamePlays || {};
    const topGames = Object.entries(gp).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,2);
    const isMe = username === currentUsername();
    const initial = username.charAt(0).toUpperCase();
    const online = isUserOnline(rec);
    let lastSeenTxt = '';
    if(!online && rec.lastActive && typeof rec.lastActive.toDate === 'function'){
      lastSeenTxt = 'Terakhir aktif ' + rec.lastActive.toDate().toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'});
    }
    body.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="profile-avatar">${escapeHtml(initial)}<span class="status-dot ${online?'online':''}"></span></div>
        <div style="font-size:18px;font-weight:800;">${escapeHtml(username)}</div>
        <div class="status-text ${online?'online':''}" style="justify-content:center;margin-top:4px;">${online? '🟢 Online · sedang main' : (lastSeenTxt||'Offline')}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">${isMe? 'Ini kamu' : 'Pengguna SANN Toolbox'}</div>
      </div>
      <div class="stat-row">
        <div class="s"><b>${daysActive}</b><span>Hari Bermain</span></div>
        <div class="s"><b>${rec.score||0}</b><span>Total Skor</span></div>
      </div>
      <div class="section-label">🎮 Game Favorit</div>
      ${topGames.length? `<div class="tool-list">${topGames.map(([gid,cnt])=>{
        const t = findTool(gid);
        return `<div class="li-row"><span style="font-size:19px;width:26px;text-align:center;flex-shrink:0;">${t?t.em:'🎮'}</span><div class="li-tx">${t?escapeHtml(t.nm):escapeHtml(gid)}</div><b style="color:var(--accent);white-space:nowrap;">${cnt}x main</b></div>`;
      }).join('')}</div>` : `<div class="empty-state"><span class="em">🎮</span>Belum ada riwayat main game.</div>`}
      ${!isMe? `<button class="btn" style="margin-top:14px;" onclick="nav('chat-${encodeURIComponent(username)}')">💬 Chat dengan ${escapeHtml(username)}</button>` : ''}
    `;
  }catch(e){
    console.error(e);
    body.innerHTML = `<div class="empty-state"><span class="em">⚠️</span>Gagal memuat profil.<br><small>Cek koneksi internet.</small></div>`;
  }
}

function loadChatThread(otherUser){
  stopChatListener();
  const me = currentUsername();
  if(!me || me===otherUser) return;
  const msgsEl = document.getElementById('chatMsgs');
  const inputEl = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  if(!msgsEl || !inputEl || !sendBtn) return;
  const chatId = chatIdFor(me, otherUser);
  _chatUnsub = db.collection('chats').doc(chatId).collection('messages').orderBy('ts','asc').limit(200)
    .onSnapshot(snap=>{
      const el = document.getElementById('chatMsgs');
      if(!el) return;
      const msgs = snap.docs.map(d=>d.data());
      el.innerHTML = msgs.length ? msgs.map(m=>{
        const mine = m.from===me;
        const time = (m.ts && typeof m.ts.toDate==='function') ? m.ts.toDate().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) : '';
        return `<div class="chat-bubble ${mine?'me':'them'}">${escapeHtml(m.text)}<div class="t">${time}</div></div>`;
      }).join('') : `<div class="empty-state"><span class="em">💬</span>Belum ada pesan. Mulai percakapan!</div>`;
      el.scrollTop = el.scrollHeight;
    }, err=>{
      console.error(err);
      const el = document.getElementById('chatMsgs');
      if(el) el.innerHTML = `<div class="empty-state"><span class="em">⚠️</span>Gagal memuat pesan.<br><small>Cek koneksi internet / rules Firestore.</small></div>`;
    });
  async function send(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    try{
      await fsSendMessage(otherUser, text);
    }catch(e){
      console.error(e);
      toast('Gagal mengirim pesan, coba lagi');
      inputEl.value = text;
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
  sendBtn.onclick = send;
  inputEl.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } };
}

function allTools(){
  let arr=[];
  CATS.forEach(c=>c.tools.forEach(t=>arr.push({...t, cat:c.id, catNm:c.nm})));
  return arr;
}
function findTool(id){ return allTools().find(t=>t.id===id); }
function findCat(id){ return CATS.find(c=>c.id===id); }

let currentPage = 'home';
let _chatUnsub = null;
function stopChatListener(){ if(_chatUnsub){ _chatUnsub(); _chatUnsub=null; } }
function nav(page){
  currentPage = page;
  location.hash = page;
  closeMenu();
  render();
  document.getElementById('content').scrollTop = 0;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', ()=>{
  const h = location.hash.replace('#','');
  if(h){ currentPage = h; render(); }
});

function render(){
  const c = document.getElementById('content');
  document.querySelectorAll('#bottomnav .bn-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.p===currentPage || (currentPage.startsWith('cat-')===false && b.dataset.p===currentPage));
  });
  let html = '';
  try{
    if(currentPage === 'home') html = renderHome();
    else if(currentPage === 'search') html = renderSearch();
    else if(currentPage === 'profil') html = renderProfil();
    else if(currentPage === 'leaderboard') html = renderLeaderboard();
    else if(currentPage === 'admin-panel') html = renderAdminPanel();
    else if(currentPage === 'inbox') html = renderInbox();
    else if(currentPage.startsWith('cat-')) html = renderCategory(currentPage.replace('cat-',''));
    else if(currentPage.startsWith('tool-')) html = renderToolWrap(currentPage.replace('tool-',''));
    else if(currentPage.startsWith('user-')) html = renderUserProfile(decodeURIComponent(currentPage.replace('user-','')));
    else if(currentPage.startsWith('chat-')) html = renderChatWrap(decodeURIComponent(currentPage.replace('chat-','')));
    else html = renderHome();
  }catch(err){
    console.error('Render error di halaman "'+currentPage+'":', err);
    html = `
      <div class="empty-state">
        <span class="em">⚠️</span>
        Terjadi kesalahan saat menampilkan halaman ini.<br>
        <span style="font-size:11px;color:var(--muted);">${escapeHtml(String(err && err.message || err))}</span>
      </div>
      <button class="btn secondary" style="margin-top:14px;" onclick="nav('home')">← Kembali ke Beranda</button>
    `;
  }
  c.innerHTML = `<div class="page active">${html}</div>`;
  try{ afterRender(); }catch(err){ console.error('afterRender error:', err); }
}

/* -- Kalkulator Ilmiah -- */
TOOL_RENDERERS['calc-ilmiah'] = (el)=>{
  let expr = '';
  el.innerHTML = `
    <div class="calc-screen"><div class="expr" id="csExpr">&nbsp;</div><div class="val" id="csVal">0</div></div>
    <div class="keypad" id="csPad"></div>
    <p class="small-note">Mendukung: + − × ÷ ^ (pangkat) √ sin cos tan log ln π e ( )</p>
  `;
  const keys = ['sin','cos','tan','C','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','√','+','(',')','π','^','log','ln','⌫','='];
  const pad = document.getElementById('csPad');
  pad.innerHTML = keys.map(k=>`<div class="key ${['÷','×','−','+','^','√'].includes(k)?'op':''} ${k==='='?'eq':''}" data-k="${k}">${k}</div>`).join('');
  function updateScreen(){
    document.getElementById('csExpr').textContent = expr || '\u00A0';
    try{
      let safe = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/√\(/g,'Math.sqrt(')
        .replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
        .replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/\^/g,'**');
      if(safe.trim()==='') { document.getElementById('csVal').textContent='0'; return; }
      let v = Function('"use strict";return ('+safe+')')();
      document.getElementById('csVal').textContent = isFinite(v) ? fmtNum(v,8) : 'Error';
    }catch(e){ document.getElementById('csVal').textContent = expr? '...' : '0'; }
  }
  pad.addEventListener('click', (e)=>{
    const k = e.target.dataset.k; if(!k) return;
    vibrate(10);
    if(k==='C'){ expr=''; }
    else if(k==='⌫'){ expr = expr.slice(0,-1); }
    else if(k==='='){
      try{
        let safe = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/√\(/g,'Math.sqrt(')
          .replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
          .replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/\^/g,'**');
        let v = Function('"use strict";return ('+safe+')')();
        expr = isFinite(v) ? String(Math.round(v*1e8)/1e8) : '';
        addXP(1);
      }catch(e){ expr=''; }
    }
    else if(['sin','cos','tan','log','ln','√'].includes(k)){ expr += k+'('; }
    else { expr += k; }
    updateScreen();
  });
  updateScreen();
};

/* -- Kalkulator Geometri -- */
TOOL_RENDERERS['calc-geometri'] = (el)=>{
  const shapes = {
    persegi:{lbl:'Persegi', fields:['sisi'], calc:(v)=>({Luas:v.sisi**2, Keliling:4*v.sisi})},
    persegipanjang:{lbl:'Persegi Panjang', fields:['panjang','lebar'], calc:(v)=>({Luas:v.panjang*v.lebar, Keliling:2*(v.panjang+v.lebar)})},
    segitiga:{lbl:'Segitiga', fields:['alas','tinggi'], calc:(v)=>({Luas:0.5*v.alas*v.tinggi})},
    lingkaran:{lbl:'Lingkaran', fields:['jari-jari'], calc:(v)=>({Luas:Math.PI*v['jari-jari']**2, Keliling:2*Math.PI*v['jari-jari']})},
    trapesium:{lbl:'Trapesium', fields:['sisi_a','sisi_b','tinggi'], calc:(v)=>({Luas:0.5*(v.sisi_a+v.sisi_b)*v.tinggi})},
    balok:{lbl:'Balok (volume)', fields:['panjang','lebar','tinggi'], calc:(v)=>({Volume:v.panjang*v.lebar*v.tinggi})},
    kubus:{lbl:'Kubus (volume)', fields:['sisi'], calc:(v)=>({Volume:v.sisi**3})},
    tabung:{lbl:'Tabung (volume)', fields:['jari-jari','tinggi'], calc:(v)=>({Volume:Math.PI*v['jari-jari']**2*v.tinggi})},
    bola:{lbl:'Bola (volume)', fields:['jari-jari'], calc:(v)=>({Volume:(4/3)*Math.PI*v['jari-jari']**3})},
  };
  let cur = 'persegi';
  function fieldHtml(){
    return shapes[cur].fields.map(f=>`<div class="field"><label>${f.replace('_',' ')} (cm)</label><input type="number" id="gf_${f}" placeholder="0"></div>`).join('');

/* -- Statistik -- */
TOOL_RENDERERS['calc-statistik'] = (el)=>{
  el.innerHTML = `
    <div class="card">
      <label>Masukkan angka (pisah dengan koma atau spasi)</label>
      <textarea id="statInput" placeholder="Contoh: 10, 20, 30, 40, 50"></textarea>
      <button class="btn" id="statCalc" style="margin-top:10px;">Hitung Statistik</button>
    </div>
    <div id="statResult"></div>
  `;
  document.getElementById('statCalc').onclick = ()=>{
    const raw = document.getElementById('statInput').value;
    const nums = raw.split(/[,\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
    if(nums.length===0){ toast('Masukkan angka yang valid'); return; }
    const n = nums.length;
    const sum = nums.reduce((a,b)=>a+b,0);
    const mean = sum/n;
    const sorted = [...nums].sort((a,b)=>a-b);
    const median = n%2===0 ? (sorted[n/2-1]+sorted[n/2])/2 : sorted[(n-1)/2];
    const freq = {};
    nums.forEach(x=>freq[x]=(freq[x]||0)+1);
    const maxFreq = Math.max(...Object.values(freq));
    const modes = Object.keys(freq).filter(k=>freq[k]===maxFreq);
    const variance = nums.reduce((a,b)=>a+(b-mean)**2,0)/n;
    const std = Math.sqrt(variance);
    document.getElementById('statResult').innerHTML = `
      <div class="stat-row"><div class="s"><b>${n}</b><span>Jumlah Data</span></div><div class="s"><b>${fmtNum(sum)}</b><span>Total</span></div></div>
      <div class="grid2">
        <div class="result-box"><div class="big">${fmtNum(mean)}</div><div class="lbl">Rata-rata</div></div>
        <div class="result-box"><div class="big">${fmtNum(median)}</div><div class="lbl">Median</div></div>
        <div class="result-box"><div class="big">${modes.length===Object.keys(freq).length? '-' : modes.join(', ')}</div><div class="lbl">Modus</div></div>
        <div class="result-box"><div class="big">${fmtNum(std)}</div><div class="lbl">Std. Deviasi</div></div>
      </div>
      <div class="small-note">Min: ${fmtNum(sorted[0])} · Max: ${fmtNum(sorted[n-1])} · Varians: ${fmtNum(variance)}</div>
    `;
    addXP(2);
  };
};

TOOL_RENDERERS['kurs'] = (el)=>{
  const currencies = ['IDR','USD','EUR','JPY','GBP','SGD','MYR','AUD','CNY','KRW','SAR','THB','INR','CHF','CAD'];
  el.innerHTML = `

      </div>

    </div>
    <div id="kRes"></div>
    <p class="small-note">Kurs diambil dari layanan kurs online dan membutuhkan koneksi internet.</p>
  `;
  document.getElementById('kBtn').onclick = async ()=>{

    const dari = document.getElementById('kDari').value;
    const ke = document.getElementById('kKe').value;

    if(dari === ke){
      res.innerHTML = `<div class="result-box"><div class="big">${fmtNum(jml,2)} ${ke}</div><div class="lbl">${fmtNum(jml)} ${dari} =</div></div>`;
      return;

    try{
      const r = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(dari)}`, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data = await r.json();
      if(data.result !== 'success' || !data.rates || typeof data.rates[ke] !== 'number') throw new Error('Kurs tidak tersedia');

      const rate = data.rates[ke];
      const val = jml * rate;
      const updated = data.time_last_update_utc ? new Date(data.time_last_update_utc).toLocaleString('id-ID') : '-';

      res.innerHTML = `
        <div class="result-box">

        <div class="small-note">Kurs 1 ${dari} = ${fmtNum(rate,6)} ${ke} · Update: ${updated}</div>
      `;
      addXP(2,'Konversi mata uang');
    }catch(e){
      res.innerHTML = `<div class="empty-state"><span class="em">⚠️</span>Gagal mengambil data kurs.<br><small>Pastikan internet aktif lalu coba lagi.</small></div>`;
    }
  };
};

/* -- Unit Converter -- */
TOOL_RENDERERS['unit-converter'] = (el)=>{
  const groups = {
    Panjang:{ units:{Meter:1, Kilometer:1000, Centimeter:.01, Milimeter:.001, Mil:1609.34, Yard:.9144, Kaki:.3048, Inci:.0254}, base:'Meter' },
    Berat:{ units:{Kilogram:1, Gram:.001, Miligram:.000001, Ton:1000, Pon:.453592, Ons:.0283495}, base:'Kilogram' },
    Suhu:{ special:true },
    Volume:{ units:{Liter:1, Mililiter:.001, 'Meter Kubik':1000, Gallon:3.78541, Cup:.24}, base:'Liter' },
    Kecepatan:{ units:{'km/jam':1, 'm/detik':3.6, 'mil/jam':1.60934, knot:1.852}, base:'km/jam' },
  };
  let cur = 'Panjang';
  function draw(){
    const g = groups[cur];
    let unitOptions = g.special ? ['Celsius','Fahrenheit','Kelvin'] : Object.keys(g.units);
    el.innerHTML = `
      <div class="chip-row" id="ucTabs">${Object.keys(groups).map(k=>`<div class="chip ${k===cur?'active':''}" data-k="${k}">${k}</div>`).join('')}</div>
      <div class="card">
        <div class="field"><label>Nilai</label><input type="number" id="ucVal" value="1"></div>
        <div class="grid2">
          <div class="field"><label>Dari</label><select id="ucFrom">${unitOptions.map(u=>`<option>${u}</option>`).join('')}</select></div>
          <div class="field"><label>Ke</label><select id="ucTo">${unitOptions.map((u,i)=>`<option ${i===1?'selected':''}>${u}</option>`).join('')}</select></div>
        </div>
      </div>
      <div id="ucRes"></div>
    `;
    document.getElementById('ucTabs').onclick = e=>{ const k=e.target.dataset.k; if(!k) return; cur=k; draw(); };
    function calc(){
      const v = parseFloat(document.getElementById('ucVal').value);
      const from = document.getElementById('ucFrom').value, to = document.getElementById('ucTo').value;
      if(isNaN(v)){ document.getElementById('ucRes').innerHTML=''; return; }
      let out;
      if(g.special){
        let c;
        if(from==='Celsius') c=v; else if(from==='Fahrenheit') c=(v-32)*5/9; else c=v-273.15;
        if(to==='Celsius') out=c; else if(to==='Fahrenheit') out=c*9/5+32; else out=c+273.15;
      } else {
        out = v*g.units[from]/g.units[to];
      }
      document.getElementById('ucRes').innerHTML = `<div class="result-box"><div class="big">${fmtNum(out,4)}</div><div class="lbl">${to}</div></div>`;
    }
    document.getElementById('ucVal').oninput = calc;
    document.getElementById('ucFrom').onchange = calc;
    document.getElementById('ucTo').onchange = calc;
    calc();
  }
  draw();
};

    canvas.width = txt.length*barW*8+40; canvas.height = h+30;
    canvas.style.width='100%'; canvas.style.borderRadius='12px';
    const ctx = canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);

/* -- Stopwatch -- */
TOOL_RENDERERS['stopwatch'] = (el)=>{
  el.innerHTML = `
    <div class="timer-display" id="swDisp">00:00.00</div>
    <div class="btn-row">
      <button class="btn" id="swStart">▶️ Mulai</button>
      <button class="btn secondary" id="swLap">🚩 Lap</button>
      <button class="btn danger" id="swReset">⏹️ Reset</button>
    </div>
    <div id="swLaps" style="margin-top:16px;"></div>
  `;
  let running=false, startT=0, elapsed=0, laps=[], raf;
  function fmt(ms){
    const m = Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), cs=Math.floor((ms%1000)/10);
    return `${pad(m)}:${pad(s)}.${pad(cs)}`;
  }
  function tick(){
    if(!running) return;
    document.getElementById('swDisp').textContent = fmt(Date.now()-startT+elapsed);
    raf = requestAnimationFrame(tick);
  }
  document.getElementById('swStart').onclick = (e)=>{
    if(!running){ running=true; startT=Date.now(); tick(); e.target.textContent='⏸️ Jeda'; }
    else{ running=false; elapsed += Date.now()-startT; cancelAnimationFrame(raf); e.target.textContent='▶️ Lanjut'; }
  };
  document.getElementById('swLap').onclick = ()=>{
    if(!running && elapsed===0) return;
    const cur = running ? Date.now()-startT+elapsed : elapsed;
    laps.unshift(cur);
    document.getElementById('swLaps').innerHTML = laps.map((l,i)=>`<div class="li-row"><div class="li-tx">Lap ${laps.length-i}</div><b style="font-family:var(--font-mono)">${fmt(l)}</b></div>`).join('');
  };
  document.getElementById('swReset').onclick = ()=>{
    running=false; elapsed=0; laps=[]; cancelAnimationFrame(raf);
    document.getElementById('swDisp').textContent = '00:00.00';
    document.getElementById('swStart').textContent='▶️ Mulai';
    document.getElementById('swLaps').innerHTML='';
  };
};

TOOL_RENDERERS['countdown'] = (el)=>{
  el.innerHTML = `
    <div class="grid3">
      <div class="field"><label>Jam</label><input type="number" id="cdH" value="0" min="0"></div>
      <div class="field"><label>Menit</label><input type="number" id="cdM" value="5" min="0" max="59"></div>
      <div class="field"><label>Detik</label><input type="number" id="cdS" value="0" min="0" max="59"></div>
    </div>
    <div class="timer-display" id="cdDisp">05:00</div>

      <button class="btn" id="cdStart">▶️ Mulai</button>
      <button class="btn danger" id="cdReset">⏹️ Reset</button>
    </div>
    <p class="small-note">Bunyi peringatan akan diputar saat waktu habis (pastikan tab tetap terbuka).</p>
  `;
  let total=300, remain=300, iv=null;
  function fmt(s){ const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return h>0? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`; }
  function beep(){
    try{ const ctx = new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.start(); g.gain.setValueAtTime(.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+0.9); o.stop(ctx.currentTime+0.9);
    }catch(e){}
  }
  document.getElementById('cdStart').onclick = (e)=>{
    if(iv){ clearInterval(iv); iv=null; e.target.textContent='▶️ Lanjut'; return; }
    if(remain<=0){
      const h=parseInt(document.getElementById('cdH').value)||0, m=parseInt(document.getElementById('cdM').value)||0, s=parseInt(document.getElementById('cdS').value)||0;
      total = h*3600+m*60+s; remain=total;
    }
    if(total<=0) return toast('Atur durasi terlebih dahulu');
    e.target.textContent='⏸️ Jeda';
    iv = setInterval(()=>{
      remain--;
      document.getElementById('cdDisp').textContent = fmt(Math.max(0,remain));
      if(remain<=0){ clearInterval(iv); iv=null; beep(); vibrate([200,100,200]); toast('⏳ Waktu habis!'); document.getElementById('cdStart').textContent='▶️ Mulai'; }
    },1000);
  };
  document.getElementById('cdReset').onclick = ()=>{
    clearInterval(iv); iv=null; remain=total=0;
    document.getElementById('cdDisp').textContent='00:00';
    document.getElementById('cdStart').textContent='▶️ Mulai';
  };
  ['cdH','cdM','cdS'].forEach(id=>document.getElementById(id).oninput=()=>{
    const h=parseInt(document.getElementById('cdH').value)||0, m=parseInt(document.getElementById('cdM').value)||0, s=parseInt(document.getElementById('cdS').value)||0;
    total=remain=h*3600+m*60+s;
    document.getElementById('cdDisp').textContent = fmt(total);
  });
};

  document.getElementById('pmStart').onclick = (e)=>{
    if(iv){ clearInterval(iv); iv=null; e.target.textContent='▶️ Lanjut'; return; }
    e.target.textContent='⏸️ Jeda';
    iv = setInterval(()=>{
      remain--;
      document.getElementById('pmDisp').textContent = fmt(Math.max(0,remain));
      if(remain<=0){
        if(mode==='focus'){ count++; DB.set('pomoCount',count); document.getElementById('pmCount').textContent=count; addXP(10,'Sesi Pomodoro selesai'); }
        toast(mode==='focus' ? '🎯 Sesi fokus selesai! Saatnya istirahat.' : '☕ Istirahat selesai, kembali fokus!');
        vibrate([200,100,200]);
        switchMode();
      }
    },1000);
  };
  document.getElementById('pmReset').onclick = ()=>{
    clearInterval(iv); iv=null; mode='focus'; remain=25*60;
    document.getElementById('pmMode').textContent='🎯 Fokus 25 menit';
    document.getElementById('pmDisp').textContent = fmt(remain);
    document.getElementById('pmStart').textContent='▶️ Mulai';
  };
};

/* -- Kalender -- */
TOOL_RENDERERS['kalender'] = (el)=>{
  let view = new Date();
  function draw(){
    const y=view.getFullYear(), m=view.getMonth();
    const first = new Date(y,m,1);
    const startDay = first.getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const today = new Date();
    const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    let cells = '';
    for(let i=0;i<startDay;i++) cells += `<div></div>`;
    for(let d=1;d<=daysInMonth;d++){
      const isToday = d===today.getDate() && m===today.getMonth() && y===today.getFullYear();
      cells += `<div style="text-align:center;padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;${isToday?'background:var(--accent);color:#1a1206;':''}">${d}</div>`;
    }
    el.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:10px;">
        <div class="icon-btn" id="kalPrev">←</div>
        <b style="font-size:15px;">${monthNames[m]} ${y}</b>
        <div class="icon-btn" id="kalNext">→</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;">
        <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>
      <button class="btn secondary" id="kalToday" style="margin-top:16px;">📍 Kembali ke Hari Ini</button>
    `;
    document.getElementById('kalPrev').onclick = ()=>{ view.setMonth(view.getMonth()-1); draw(); };
    document.getElementById('kalNext').onclick = ()=>{ view.setMonth(view.getMonth()+1); draw(); };
    document.getElementById('kalToday').onclick = ()=>{ view = new Date(); draw(); };
  }
  draw();
};

/* -- Kiblat -- */
TOOL_RENDERERS['kiblat'] = (el)=>{
  el.innerHTML = `<div class="card"><button class="btn" id="qGeo">📍 Hitung Arah Kiblat</button></div><div id="qRes"></div>`;
  document.getElementById('qGeo').onclick = ()=>{
    if(!navigator.geolocation) return toast('Geolocation tidak didukung');
    navigator.geolocation.getCurrentPosition(pos=>{
      const lat1 = pos.coords.latitude*Math.PI/180, lon1 = pos.coords.longitude*Math.PI/180;
      const lat2 = 21.4225*Math.PI/180, lon2 = 39.8262*Math.PI/180; // Ka'bah
      const dLon = lon2-lon1;
      const y = Math.sin(dLon)*Math.cos(lat2);
      const x = Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
      let brng = Math.atan2(y,x)*180/Math.PI;
      brng = (brng+360)%360;
      document.getElementById('qRes').innerHTML = `

/* -- Sunrise/Sunset -- */
TOOL_RENDERERS['sunrise'] = (el)=>{
  el.innerHTML = `<div class="card"><button class="btn" id="ssGeo">📍 Cek Waktu Hari Ini</button></div><div id="ssRes"></div>`;
  document.getElementById('ssGeo').onclick = ()=>{
    if(!navigator.geolocation) return toast('Geolocation tidak didukung');
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const {latitude, longitude} = pos.coords;
        const r = await fetch(`https://api.sunrise-sunset.org/json?lat=${latitude}&lng=${longitude}&formatted=0`);
        const data = await r.json();
        const fmt = (iso)=> new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('ssRes').innerHTML = `
          <div class="grid2">
            <div class="result-box"><div class="big">🌅 ${fmt(data.results.sunrise)}</div><div class="lbl">Matahari Terbit</div></div>
            <div class="result-box"><div class="big">🌇 ${fmt(data.results.sunset)}</div><div class="lbl">Matahari Terbenam</div></div>
          </div>
          <div class="small-note">Lama siang hari: ${data.results.day_length ? Math.floor(data.results.day_length/3600)+' jam '+Math.floor((data.results.day_length%3600)/60)+' menit' : '-'}</div>
        `;
        addXP(2);
      }catch(e){ document.getElementById('ssRes').innerHTML = `<div class="empty-state"><span class="em">⚠️</span>Gagal memuat data.</div>`; }
    }, ()=> toast('Izin lokasi ditolak'));
  };
};

function renderTodo(el){

      <div class="card">

  };
  window.tdDel = (i)=>{ const todos = DB.get('todos', []); todos.splice(i,1); DB.set('todos',todos); draw(); };
  draw();
}

/* -- Habit Tracker -- */
TOOL_RENDERERS['habit'] = (el)=>{
  function weekKey(){ const d=new Date(); const day=d.getDay(); const sun=new Date(d); sun.setDate(d.getDate()-day); return sun.toISOString().slice(0,10); }
  function draw(){
    const habits = DB.get('habits', []);
    const wk = weekKey();
    const days = ['M','S','S','R','K','J','S'];
    el.innerHTML = `
      <div class="card"><div class="row"><input type="text" id="hbInput" placeholder="Nama kebiasaan, misal: Olahraga" style="flex:1;"><button class="btn sm" id="hbAdd">+</button></div></div>
      <div id="hbList"></div>
    `;
    document.getElementById('hbList').innerHTML = habits.length ? habits.map((h,hi)=>{
      const prog = h.progress[wk] || [false,false,false,false,false,false,false];
      return `<div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px;"><b style="font-size:14px;">${escapeHtml(h.name)}</b><span class="li-del" onclick="hbDel(${hi})">🗑️</span></div>
        <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:5px;">
          ${days.map((d,i)=>`<div class="checkbox ${prog[i]?'checked':''}" style="margin:0 auto;" onclick="hbToggle(${hi},${i})">${prog[i]?'✓':d}</div>`).join('')}
        </div>
      </div>`;
    }).join('') : '<div class="empty-state"><span class="em">🎯</span>Belum ada kebiasaan yang dilacak</div>';
    document.getElementById('hbAdd').onclick = ()=>{
      const val = document.getElementById('hbInput').value.trim(); if(!val) return;
      const habits = DB.get('habits', []); habits.push({name:val, progress:{}}); DB.set('habits',habits);
      addXP(2); draw();
    };
  }
  window.hbToggle = (hi,di)=>{
    const habits = DB.get('habits', []); const wk = weekKey();
    if(!habits[hi].progress[wk]) habits[hi].progress[wk] = [false,false,false,false,false,false,false];
    habits[hi].progress[wk][di] = !habits[hi].progress[wk][di];
    DB.set('habits',habits); addXP(2); draw();
  };
  window.hbDel = (hi)=>{ const habits = DB.get('habits', []); habits.splice(hi,1); DB.set('habits',habits); draw(); };
  draw();
};

TOOL_RENDERERS['backup'] = (el)=>{
  el.innerHTML = `
    <div class="card">
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">Ekspor semua data (catatan, todo, skor, profil, dll) ke file JSON sebagai cadangan, atau impor kembali dari file yang pernah diekspor.</p>
      <button class="btn" id="bkExport">💾 Ekspor Data</button>
      <div class="divider"></div>
      <label>Impor dari file</label>
      <input type="file" id="bkImport" accept=".json">
    </div>
  `;
  document.getElementById('bkExport').onclick = ()=>{
    let all = {};
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith('sann_')) all[k]=localStorage.getItem(k); }
    const blob = new Blob([JSON.stringify(all,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sann-toolbox-backup.json'; a.click();
    toast('Data diekspor 💾');
  };
  document.getElementById('bkImport').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
        toast('Data berhasil diimpor ✅ Memuat ulang...');
        setTimeout(()=>location.reload(), 1000);
      }catch(err){ toast('File tidak valid'); }
    };
    reader.readAsText(file);
  };
};

  function draw(){
    const cur = DB.get('accent', '#f2a541');
    el.innerHTML = `
      <div class="color-swatch" style="background:${cur};height:80px;border-radius:16px;margin-bottom:12px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;">
        <span style="background:rgba(0,0,0,.45);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;">${cur.toUpperCase()}</span>
      </div>
      <div class="card">
        <label>Pilih warna aksen cepat</label>
        <div class="row wrap" style="gap:10px;margin-top:8px;">
          ${colors.map(c=>`
            <div data-c="${c}" style="width:40px;height:40px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c===cur?'#fff':'var(--border)'};box-shadow:${c===cur?'0 0 0 2px var(--accent)':'none'};transition:.15s;"></div>
          `).join('')}
        </div>
        <div class="field" style="margin-top:18px;">
          <label>Atau pilih warna custom</label>
          <input type="color" id="customColor" value="${cur}">
        </div>
        <button class="btn" id="applyCustom" style="margin-top:10px;">✨ Terapkan Warna</button>
      </div>
      <p class="small-note">Warna aksen langsung diterapkan ke tombol, XP bar, badge, dan elemen utama aplikasi.</p>
    `;
    el.querySelectorAll('[data-c]').forEach(dot=>{
      dot.onclick = ()=>{
        setAccent(dot.dataset.c);
        draw();
      };
    });
    document.getElementById('applyCustom').onclick = ()=>{
      const hex = document.getElementById('customColor').value;
      setAccent(hex);
      draw();
    };
    document.getElementById('customColor').oninput = (e)=>{
      const hex = e.target.value;
      document.documentElement.style.setProperty('--accent', hex);
      try {
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        const lighten = (c) => Math.min(255, Math.round(c + (255-c)*0.25));
        const a2 = '#' + [lighten(r),lighten(g),lighten(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
        document.documentElement.style.setProperty('--accent2', a2);
      } catch(_){}
    };
  }
  draw();
};

function renderFlashcard(lang, el){
  const set = VOCAB[lang];
  let idx = 0, flipped = false;
  function draw(){
    const [word, mean] = set.data[idx];
    el.innerHTML = `
      <div class="flashcard" id="fcCard"><div class="main">${flipped? mean : word}</div><div class="sub">${flipped? 'Arti · ketuk untuk kembali' : 'Ketuk untuk lihat arti'}</div></div>
      <div class="row" style="justify-content:space-between;">
        <button class="btn secondary sm" id="fcPrev">← Sebelumnya</button>
        <span style="font-size:12px;color:var(--muted);align-self:center;">${idx+1}/${set.data.length}</span>
        <button class="btn secondary sm" id="fcNext">Berikutnya →</button>
      </div>
      <button class="btn ghost" id="fcSpeak" style="margin-top:12px;">🔊 Dengarkan Pengucapan</button>
    `;
    document.getElementById('fcCard').onclick = ()=>{ flipped=!flipped; draw(); };
    document.getElementById('fcPrev').onclick = ()=>{ idx=(idx-1+set.data.length)%set.data.length; flipped=false; draw(); };
    document.getElementById('fcNext').onclick = ()=>{ idx=(idx+1)%set.data.length; flipped=false; draw(); addXP(1); };
    document.getElementById('fcSpeak').onclick = ()=> speakText(word.replace(/\(.*?\)/,''), set.voice);
  }
  draw();
}
function speakText(text, lang){
  if(!('speechSynthesis' in window)) return toast('Perangkat tidak mendukung Text-to-Speech');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'id-ID';
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

});

TOOL_RENDERERS['quiz'] = (el)=>{
  const langs = Object.keys(VOCAB);
  let lang = 'english', qIdx=0, score=0, options=[], correct='';
  function newQuestion(){
    const set = VOCAB[lang].data;
    qIdx = Math.floor(Math.random()*set.length);
    const [word, mean] = set[qIdx];
    correct = mean;
    let opts = [mean];
    while(opts.length<4){ const r = set[Math.floor(Math.random()*set.length)][1]; if(!opts.includes(r)) opts.push(r); }
    opts.sort(()=>Math.random()-0.5);
    options = opts;
    return word;
  }
  function draw(){
    const word = newQuestion();
    el.innerHTML = `
      <div class="chip-row" id="quizLangChips">${langs.map(l=>`<div class="chip ${l===lang?'active':''}" data-l="${l}">${VOCAB[l].flag} ${l}</div>`).join('')}</div>
      <div class="stat-row"><div class="s"><b>${score}</b><span>Skor</span></div></div>
      <div class="card" style="text-align:center;"><div style="font-size:22px;font-weight:800;margin-bottom:16px;">${word}</div>
        ${options.map(o=>`<button class="btn secondary" style="margin-bottom:8px;" onclick="quizAnswer('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
    `;
    document.getElementById('quizLangChips').onclick = e=>{ const l=e.target.dataset.l; if(!l) return; lang=l; score=0; draw(); };
  }
  window.quizAnswer = (ans)=>{
    if(ans===correct){ score++; toast('✅ Benar!'); addXP(2); } else { toast('❌ Salah, jawaban: '+correct); }
    draw();
  };
  draw();
};

    else if(beats(choice,comp)){ win++; msg='🎉 Kamu Menang!'; addXP(3); if(win===1) recordGameWin(); saveHighscore('g-rps',win); }
    else { lose++; msg='😢 Kamu Kalah!'; }
    draw(`<div class="result-box"><div class="big">${emoji[choice]} vs ${emoji[comp]}</div><div class="lbl">${msg}</div></div>`);
  };
  draw();
};

/* Tic Tac Toe */
TOOL_RENDERERS['g-ttt'] = (el)=>{
  let board = Array(9).fill(''), over=false;
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function checkWin(b, p){ return wins.some(w=>w.every(i=>b[i]===p)); }
  function compMove(){
    let empty = board.map((v,i)=>v===''?i:null).filter(v=>v!==null);
    // try win
    for(let i of empty){ const b=[...board]; b[i]='O'; if(checkWin(b,'O')) return i; }
    for(let i of empty){ const b=[...board]; b[i]='X'; if(checkWin(b,'X')) return i; }
    if(board[4]==='') return 4;
    return empty[Math.floor(Math.random()*empty.length)];
  }
  function draw(msg){
    el.innerHTML = `
      <div class="ttt-board">${board.map((v,i)=>`<div class="ttt-cell" data-i="${i}" style="color:${v==='X'?'var(--accent)':'var(--info)'}">${v}</div>`).join('')}</div>
      ${msg? `<div class="result-box">${msg}</div>` : ''}
      <button class="btn secondary" id="tttReset">🔄 Main Lagi</button>
    `;
    document.querySelectorAll('.ttt-cell').forEach(c=>c.onclick = ()=>{
      const i = parseInt(c.dataset.i);
      if(board[i]!==''||over) return;
      board[i]='X';
      if(checkWin(board,'X')){ over=true; recordGameWin(); addXP(6,'Menang Tic Tac Toe'); draw('🎉 Kamu Menang!'); return; }
      if(board.every(v=>v)){ over=true; draw('🤝 Seri!'); return; }
      const ci = compMove(); board[ci]='O';
      if(checkWin(board,'O')){ over=true; draw('😢 Komputer Menang!'); return; }
      if(board.every(v=>v)){ over=true; draw('🤝 Seri!'); return; }
      draw();
    });
    document.getElementById('tttReset').onclick = ()=>{ board=Array(9).fill(''); over=false; draw(); };
  }
  draw();
};

TOOL_RENDERERS['g-memory'] = (el)=>{
  const emojis = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🥝'];
  let cards = [...emojis,...emojis].sort(()=>Math.random()-0.5);
  let flipped=[], matched=[], moves=0, lock=false;
  function draw(){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${moves}</b><span>Langkah</span></div><div class="s"><b>${matched.length/2}/${emojis.length}</b><span>Pasangan</span></div></div>
      <div class="mem-board">${cards.map((c,i)=>`<div class="mem-cell ${flipped.includes(i)||matched.includes(i)?'flip':''} ${matched.includes(i)?'matched':''}" data-i="${i}">${flipped.includes(i)||matched.includes(i)?c:'❓'}</div>`).join('')}</div>
      <button class="btn secondary" id="memReset" style="margin-top:10px;">🔄 Main Lagi</button>
    `;
    document.querySelectorAll('.mem-cell').forEach(c=>c.onclick=()=>{
      const i = parseInt(c.dataset.i);
      if(lock||flipped.includes(i)||matched.includes(i)) return;
      flipped.push(i);
      if(flipped.length===2){
        moves++; lock=true;
        draw();
        setTimeout(()=>{
          if(cards[flipped[0]]===cards[flipped[1]]){ matched.push(...flipped); if(matched.length===cards.length){ recordGameWin(); saveHighscore('g-memory',moves,false); addXP(10,'Menang Memory Card'); } }
          flipped=[]; lock=false; draw();
        }, 700);
      } else draw();
    });
    document.getElementById('memReset').onclick = ()=>{
      cards = [...emojis,...emojis].sort(()=>Math.random()-0.5); flipped=[]; matched=[]; moves=0; lock=false; draw();
    };
  }
  draw();
};
