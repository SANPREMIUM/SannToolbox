  ];
  const AYAT_QURAN = [
    ['Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya.','QS. Al-Baqarah 2:286'],
    ['Ingatlah, hanya dengan mengingat Allah hati menjadi tenteram.','QS. Ar-Ra\'d 13:28'],
    ['Sesungguhnya bersama kesulitan itu ada kemudahan.','QS. Al-Insyirah 94:6'],
    ['Mohonlah pertolongan dengan sabar dan sholat, sesungguhnya Allah beserta orang-orang yang sabar.','QS. Al-Baqarah 2:153'],
    ['Barangsiapa bertawakal kepada Allah, maka cukuplah Allah menjadi penolong baginya.','QS. Ath-Thalaq 65:3'],
    ['Dan bermusyawarahlah dengan mereka dalam urusan itu, lalu apabila engkau telah membulatkan tekad, maka bertawakallah kepada Allah.','QS. Ali Imran 3:159'],
  ];
  let asmaulQ = '';
  function drawAsmaul(box){
    const filtered = ASMAUL_HUSNA.map((v,i)=>({v,i})).filter(({v})=>{
      if(!asmaulQ) return true;
      const s=asmaulQ.toLowerCase();
      return v[0].toLowerCase().includes(s) || v[2].toLowerCase().includes(s);
    });
    box.innerHTML = `
      <p class="page-sub">99 Asmaul Husna — nama-nama indah Allah SWT beserta artinya. "Allah memiliki Asmaul Husna, maka bermohonlah kepada-Nya dengan menyebutnya." (QS. Al-A'raf: 180)</p>
      <div class="search-wrap"><span>🔍</span><input type="text" id="ahSearch" placeholder="Cari nama atau arti..." value="${asmaulQ}"></div>
      <div class="tool-list">
        ${filtered.map(({v,i})=>`<div class="li-row"><div class="li-tx"><b>${i+1}. ${v[0]}</b> <span style="font-family:var(--font-mono);float:right;">${v[1]}</span><br><span style="color:var(--muted);font-size:12.5px;">${v[2]}</span></div></div>`).join('') || '<div class="empty-state"><span class="em">🔍</span>Tidak ditemukan</div>'}
      </div>
    `;
    const s = document.getElementById('ahSearch');
    s.oninput = ()=>{ asmaulQ = s.value; drawAsmaul(box); document.getElementById('ahSearch').focus(); };
  }
  function drawZakat(box){
    box.innerHTML = `
      <div class="card">
        <div class="section-label" style="margin-top:0;">Zakat Fitrah</div>
        <p class="small-note">Wajib bagi setiap jiwa muslim menjelang Idul Fitri, senilai ± 2,5 kg / 3,5 liter beras (atau uang senilai itu).</p>
        <div class="field"><label>Jumlah jiwa</label><input type="number" id="zfJiwa" placeholder="4"></div>
        <div class="field"><label>Harga beras per kg (Rp)</label><input type="number" id="zfHarga" placeholder="15000"></div>
        <button class="btn" id="zfBtn">Hitung Zakat Fitrah</button>
        <div id="zfRes"></div>
      </div>
      <div class="card">
        <div class="section-label" style="margin-top:0;">Zakat Maal (Harta)</div>
        <p class="small-note">Wajib bila harta sudah mencapai nisab (± setara 85 gram emas) dan disimpan setahun (haul). Besarnya 2,5% dari total harta.</p>
        <div class="field"><label>Total harta (Rp)</label><input type="number" id="zmHarta" placeholder="50000000"></div>
        <div class="field"><label>Harga emas per gram saat ini (Rp)</label><input type="number" id="zmEmas" placeholder="1500000"></div>
        <button class="btn" id="zmBtn">Hitung Zakat Maal</button>
        <div id="zmRes"></div>
      </div>
    `;
    document.getElementById('zfBtn').onclick = ()=>{
      const jiwa = parseFloat(document.getElementById('zfJiwa').value);
      const harga = parseFloat(document.getElementById('zfHarga').value);
      if(isNaN(jiwa)||isNaN(harga)||jiwa<=0||harga<=0) return toast('Isi semua kolom dengan benar');
      const total = jiwa*2.5*harga;
      document.getElementById('zfRes').innerHTML = `<div class="result-box"><div class="big">Rp ${fmtNum(total)}</div><div class="lbl">Total zakat fitrah untuk ${jiwa} jiwa (2,5 kg/jiwa)</div></div>`;
      addXP(1);
    };
    document.getElementById('zmBtn').onclick = ()=>{
      const harta = parseFloat(document.getElementById('zmHarta').value);
      const emas = parseFloat(document.getElementById('zmEmas').value);
      if(isNaN(harta)||harta<=0) return toast('Isi total harta dengan benar');
      const nisab = !isNaN(emas)&&emas>0 ? emas*85 : null;
      if(nisab && harta<nisab){
        document.getElementById('zmRes').innerHTML = `<div class="result-box"><div class="big">Belum Wajib</div><div class="lbl">Harta di bawah nisab (Rp ${fmtNum(nisab)}), belum wajib zakat maal</div></div>`;
      } else {
        const zakat = harta*0.025;
        document.getElementById('zmRes').innerHTML = `<div class="result-box"><div class="big">Rp ${fmtNum(zakat)}</div><div class="lbl">Zakat maal (2,5% dari harta)${nisab?` — Nisab: Rp ${fmtNum(nisab)}`:''}</div></div>`;
      }
      addXP(1);
    };
  }
  function draw(t){
    el.innerHTML = `
      <p class="page-sub">Ruang renungan & referensi keislaman sehari-hari.</p>
      <div class="chip-row" id="islamTabs">
        ${TABS.map(([id,nm])=>`<div class="chip ${t===id?'active':''}" data-t="${id}">${nm}</div>`).join('')}
      </div>
      <div id="islamBody"></div>
    `;
    const body = document.getElementById('islamBody');
    if(t==='kitab'){
      body.innerHTML = `<div class="card"><div style="font-size:40px;text-align:center;">📖</div><div style="font-size:18px;font-weight:800;text-align:center;margin-top:4px;">Al-Qur'an</div><p class="small-note" style="text-align:center;">Kitab suci umat Islam yang diturunkan Allah SWT kepada Nabi Muhammad SAW melalui perantaraan Malaikat Jibril secara berangsur-angsur selama ± 23 tahun, terdiri dari 30 juz, 114 surat, dan menjadi pedoman hidup umat Islam.</p></div>`;
    } else if(t==='hari'){
      body.innerHTML = `<div class="tool-list">${HARI_RAYA.map(([n,tgl,d])=>`<div class="li-row"><div class="li-tx"><b>${escapeHtml(n)}</b> <span style="color:var(--accent);font-size:12px;float:right;">${escapeHtml(tgl)}</span><br><span style="color:var(--muted);font-size:12.5px;">${escapeHtml(d)}</span></div></div>`).join('')}</div>`;
    } else if(t==='sholat'){
      body.innerHTML = `<div id="islamSholatBox"></div>`;
      TOOL_RENDERERS['sholat'](document.getElementById('islamSholatBox'));
    } else if(t==='kiblat'){
      body.innerHTML = `<div id="islamKiblatBox"></div>`;
      TOOL_RENDERERS['kiblat'](document.getElementById('islamKiblatBox'));
    } else if(t==='zakat'){
      drawZakat(body);
    } else if(t==='asmaul'){
      drawAsmaul(body);
    } else if(t==='ayat'){
      body.innerHTML = `<div class="tool-list">${AYAT_QURAN.map(([txt,src])=>`<div class="li-row"><div class="li-tx" style="font-style:italic;">"${escapeHtml(txt)}"<br><span style="color:var(--muted);font-size:12.5px;font-style:normal;">— ${escapeHtml(src)}</span></div></div>`).join('')}</div>`;
    }
    document.getElementById('islamTabs').onclick = e=>{
      const tt = e.target.dataset.t; if(!tt) return;
      draw(tt);
    };
  }
  draw('kitab');
};

    el.innerHTML = `
      <p class="page-sub">Ruang renungan & referensi ajaran ${escapeHtml(d.nm)}.</p>
      <div class="chip-row" id="relTabs">
        ${TABS.map(([id,nm])=>`<div class="chip ${t===id?'active':''}" data-t="${id}">${nm}</div>`).join('')}
      </div>
      <div id="relBody"></div>
    `;
    const body = document.getElementById('relBody');
    if(t==='kitab'){
      body.innerHTML = `<div class="card"><div style="font-size:40px;text-align:center;">📖</div><p class="small-note" style="text-align:center;">${escapeHtml(d.kitab)}</p></div>`;
    } else if(t==='tempat'){
      body.innerHTML = `<div class="card"><div style="font-size:40px;text-align:center;">🏛️</div><div style="font-size:18px;font-weight:800;text-align:center;margin-top:4px;">${escapeHtml(d.tempat)}</div></div>`;
    } else if(t==='hari'){
      body.innerHTML = `<div class="tool-list">${d.hariRaya.map(([n,tgl,ds])=>`<div class="li-row"><div class="li-tx"><b>${escapeHtml(n)}</b> <span style="color:var(--accent);font-size:12px;float:right;">${escapeHtml(tgl)}</span><br><span style="color:var(--muted);font-size:12.5px;">${escapeHtml(ds)}</span></div></div>`).join('')}</div>`;
    } else if(t==='ayat'){
      body.innerHTML = `<div class="tool-list">${d.ayat.map(([txt,src])=>`<div class="li-row"><div class="li-tx" style="font-style:italic;">"${escapeHtml(txt)}"<br><span style="color:var(--muted);font-size:12.5px;font-style:normal;">— ${escapeHtml(src)}</span></div></div>`).join('')}</div>`;

function recordGameWin(){ const p=getProfile(); p.gamesWon=(p.gamesWon||0)+1; saveProfile(p); checkAchievements(); }
function saveHighscore(key, val, higherBetter=true){
  const scores = DB.get('gameScores', {});

}

  const emoji = {batu:'🪨', gunting:'✂️', kertas:'📄'};
  function beats(a,b){ return (a==='batu'&&b==='gunting')||(a==='gunting'&&b==='kertas')||(a==='kertas'&&b==='batu'); }
  function draw(result){

      </div>
    `;
  }
  window.rpsPlay = (choice)=>{
    const opts = Object.keys(emoji);
    const comp = opts[Math.floor(Math.random()*3)];

    if(choice===comp){ draw_++; msg='🤝 Seri!'; }

/* Tic Tac Toe */
TOOL_RENDERERS['g-ttt'] = (el)=>{
  let board = Array(9).fill(''), over=false;
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function checkWin(b, p){ return wins.some(w=>w.every(i=>b[i]===p)); }
  function compMove(){
    let empty = board.map((v,i)=>v===''?i:null).filter(v=>v!==null);
    // try win
    for(let i of empty){ const b=[...board]; b[i]='O'; if(checkWin(b,'O')) return i; }
    for(let i of empty){ const b=[...board]; b[i]='X'; if(checkWin(b,'X')) return i; }
    if(board[4]==='') return 4;
    return empty[Math.floor(Math.random()*empty.length)];
  }
  function draw(msg){
    el.innerHTML = `
      <div class="ttt-board">${board.map((v,i)=>`<div class="ttt-cell" data-i="${i}" style="color:${v==='X'?'var(--accent)':'var(--info)'}">${v}</div>`).join('')}</div>
      ${msg? `<div class="result-box">${msg}</div>` : ''}
      <button class="btn secondary" id="tttReset">🔄 Main Lagi</button>
    `;
    document.querySelectorAll('.ttt-cell').forEach(c=>c.onclick = ()=>{
      const i = parseInt(c.dataset.i);
      if(board[i]!==''||over) return;
      board[i]='X';
      if(checkWin(board,'X')){ over=true; recordGameWin(); addXP(6,'Menang Tic Tac Toe'); draw('🎉 Kamu Menang!'); return; }
      if(board.every(v=>v)){ over=true; draw('🤝 Seri!'); return; }
      const ci = compMove(); board[ci]='O';
      if(checkWin(board,'O')){ over=true; draw('😢 Komputer Menang!'); return; }
      if(board.every(v=>v)){ over=true; draw('🤝 Seri!'); return; }
      draw();
    });
    document.getElementById('tttReset').onclick = ()=>{ board=Array(9).fill(''); over=false; draw(); };
  }
  draw();
};

/* Memory Card */
TOOL_RENDERERS['g-memory'] = (el)=>{
  const emojis = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🥝'];
  let cards = [...emojis,...emojis].sort(()=>Math.random()-0.5);
  let flipped=[], matched=[], moves=0, lock=false;
  function draw(){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${moves}</b><span>Langkah</span></div><div class="s"><b>${matched.length/2}/${emojis.length}</b><span>Pasangan</span></div></div>
      <div class="mem-board">${cards.map((c,i)=>`<div class="mem-cell ${flipped.includes(i)||matched.includes(i)?'flip':''} ${matched.includes(i)?'matched':''}" data-i="${i}">${flipped.includes(i)||matched.includes(i)?c:'❓'}</div>`).join('')}</div>
      <button class="btn secondary" id="memReset" style="margin-top:10px;">🔄 Main Lagi</button>
    `;
    document.querySelectorAll('.mem-cell').forEach(c=>c.onclick=()=>{
      const i = parseInt(c.dataset.i);
      if(lock||flipped.includes(i)||matched.includes(i)) return;
      flipped.push(i);
      if(flipped.length===2){
        moves++; lock=true;
        draw();
        setTimeout(()=>{
          if(cards[flipped[0]]===cards[flipped[1]]){ matched.push(...flipped); if(matched.length===cards.length){ recordGameWin(); saveHighscore('g-memory',moves,false); addXP(10,'Menang Memory Card'); } }
          flipped=[]; lock=false; draw();
        }, 700);
      } else draw();
    });
    document.getElementById('memReset').onclick = ()=>{
      cards = [...emojis,...emojis].sort(()=>Math.random()-0.5); flipped=[]; matched=[]; moves=0; lock=false; draw();
    };
  }
  draw();
};

/* Simon Says */
TOOL_RENDERERS['g-simon'] = (el)=>{
  const colors = ['#f87171','#4ade80','#60a5fa','#facc15'];
  let seq=[], userSeq=[], level=0, playing=false;
  function draw(msg){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${level}</b><span>Level</span></div></div>
      ${msg? `<div class="result-box">${msg}</div>`:''}
      <div class="simon-board">${colors.map((c,i)=>`<div class="simon-pad" data-i="${i}" style="background:${c};"></div>`).join('')}</div>
      <button class="btn" id="simonStart" ${playing?'disabled':''}>▶️ ${level>0?'Main Lagi':'Mulai'}</button>
    `;
    document.querySelectorAll('.simon-pad').forEach(p=>p.onclick=()=>{
      if(!playing) return;
      const i = parseInt(p.dataset.i);
      flashPad(i);
      userSeq.push(i);
      if(userSeq[userSeq.length-1] !== seq[userSeq.length-1]){
        playing=false; saveHighscore('g-simon', level-1); if(level>1) recordGameWin();
        draw(`😢 Salah! Kamu mencapai level ${level-1}.`); level=0; return;
      }
      if(userSeq.length===seq.length){
        addXP(3);
        setTimeout(()=>nextLevel(), 500);
      }
    });
    document.getElementById('simonStart').onclick = ()=>{ level=0; seq=[]; nextLevel(); };
  }
  function flashPad(i){
    const pad = document.querySelectorAll('.simon-pad')[i];
    pad.classList.add('lit'); setTimeout(()=>pad.classList.remove('lit'), 300);
  }
  function nextLevel(){
    level++; userSeq=[]; playing=false;
    seq.push(Math.floor(Math.random()*4));
    draw();
    playing=false;
    let i=0;
    const iv = setInterval(()=>{
      flashPad(seq[i]); i++;
      if(i>=seq.length){ clearInterval(iv); playing=true; }
    }, 500);
  }
  draw();
};

/* Math Challenge */
TOOL_RENDERERS['g-math'] = (el)=>{
  let score=0, timeLeft=30, iv=null, cur=null, playing=false;
  function newQ(){
    const ops=['+','-','×']; const op=ops[Math.floor(Math.random()*ops.length)];
    let a=Math.floor(Math.random()*20)+1, b=Math.floor(Math.random()*20)+1;
    if(op==='×'){ a=Math.floor(Math.random()*12)+1; b=Math.floor(Math.random()*12)+1; }
    let ans = op==='+'? a+b : op==='-'? a-b : a*b;
    cur = {a,b,op,ans};
  }
  function draw(){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${score}</b><span>Skor</span></div><div class="s"><b>${timeLeft}s</b><span>Waktu</span></div></div>
      ${playing? `

        <div class="card"><div class="row"><input type="number" id="mcInput" style="flex:1;" autofocus><button class="btn sm" id="mcBtn">Jawab</button></div></div>

    `;
    if(playing){
      document.getElementById('mcInput').focus();
      document.getElementById('mcBtn').onclick = ()=>{
        const v = parseInt(document.getElementById('mcInput').value);
        if(v===cur.ans){ score++; newQ(); draw(); } else { toast('❌ Salah! Jawaban: '+cur.ans); newQ(); draw(); }
      };
      document.getElementById('mcInput').onkeydown = e=>{ if(e.key==='Enter') document.getElementById('mcBtn').click(); };
    } else {
      document.getElementById('mcStart').onclick = ()=>{
        score=0; timeLeft=30; playing=true; newQ(); draw();
        iv = setInterval(()=>{
          timeLeft--;
          document.querySelector('.stat-row .s:nth-child(2) b').textContent = timeLeft+'s';
          if(timeLeft<=0){ clearInterval(iv); playing=false; saveHighscore('g-math',score); if(score>0) recordGameWin(); addXP(Math.min(20,score*2),'Math Challenge selesai'); draw(); toast('⏱️ Waktu habis! Skor: '+score); }
        },1000);
      };
    }
  }
  draw();
};

TOOL_RENDERERS['g-reaction'] = (el)=>{
  let state='idle', t0=0;
  function draw(){
    if(state==='idle'){
      el.innerHTML = `<div class="card" style="text-align:center;padding:50px 20px;background:var(--surface2);" id="reactBox"><div style="font-size:16px;font-weight:700;">Tekan untuk mulai,<br>lalu tunggu warna hijau</div></div>`;
      document.getElementById('reactBox').onclick = ()=>{
        state='waiting'; draw();
        const delay = 1500+Math.random()*2500;
        setTimeout(()=>{ if(state==='waiting'){ state='go'; t0=Date.now(); draw(); } }, delay);
      };
    } else if(state==='waiting'){
      el.innerHTML = `<div class="card" style="text-align:center;padding:50px 20px;background:var(--bad);color:#fff;" id="reactBox"><div style="font-size:16px;font-weight:700;">Tunggu... jangan klik dulu!</div></div>`;
      document.getElementById('reactBox').onclick = ()=>{ state='tooearly'; draw(); };

      el.innerHTML = `<div class="card" style="text-align:center;padding:50px 20px;background:var(--good);color:#0a2a10;" id="reactBox"><div style="font-size:18px;font-weight:800;">KLIK SEKARANG!</div></div>`;
      document.getElementById('reactBox').onclick = ()=>{
        const time = Date.now()-t0;
        const isBest = saveHighscore('g-reaction', time, false);

};

/* 2048 */
TOOL_RENDERERS['g-2048'] = (el)=>{
  let grid, score;
  function init(){ grid=Array(16).fill(0); score=0; addTile(); addTile(); }
  function addTile(){ const empty=grid.map((v,i)=>v===0?i:null).filter(v=>v!==null); if(!empty.length) return; grid[empty[Math.floor(Math.random()*empty.length)]] = Math.random()<0.9?2:4; }
  function colorFor(v){ const c={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'}; return c[v]||'#3c3a32'; }
  function draw(msg){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${score}</b><span>Skor</span></div><div class="s"><b>${DB.get('gameScores',{})['g-2048']||0}</b><span>Rekor</span></div></div>
      ${msg||''}
      <div class="g2048-board">${grid.map(v=>`<div class="g2048-cell" style="background:${v?colorFor(v):'var(--surface3)'};color:${v<=4?'#5a5248':'#fff'};">${v||''}</div>`).join('')}</div>
      <p class="small-note">Geser (swipe) di papan untuk menggerakkan, atau gunakan tombol panah di keyboard.</p>
      <button class="btn secondary" id="g2048Reset" style="margin-top:8px;">🔄 Main Lagi</button>
    `;
    document.getElementById('g2048Reset').onclick = ()=>{ init(); draw(); };
    const board = el.querySelector('.g2048-board');
    let sx,sy;
    board.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
    board.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX-sx, dy = e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
    }, {passive:true});
  }
  function move(dir){
    const before = JSON.stringify(grid);
    const get=(r,c)=>grid[r*4+c], set=(r,c,v)=>grid[r*4+c]=v;
    function slideLine(line){
      let arr = line.filter(v=>v!==0);
      for(let i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); } }
      while(arr.length<4) arr.push(0);
      return arr;
    }
    for(let i=0;i<4;i++){
      let line=[];
      if(dir==='left'||dir==='right'){ for(let c=0;c<4;c++) line.push(get(i,c)); if(dir==='right') line.reverse(); line=slideLine(line); if(dir==='right') line.reverse(); for(let c=0;c<4;c++) set(i,c,line[c]); }
      else { for(let r=0;r<4;r++) line.push(get(r,i)); if(dir==='down') line.reverse(); line=slideLine(line); if(dir==='down') line.reverse(); for(let r=0;r<4;r++) set(r,i,line[r]); }
    }
    if(JSON.stringify(grid)!==before){
      addTile();
      const isBest = saveHighscore('g-2048', score);
      if(grid.includes(2048)){ recordGameWin(); addXP(30,'Mencapai 2048!'); draw('<div class="result-box" style="color:var(--good)">🎉 Kamu mencapai 2048!</div>'); return; }
      if(grid.every(v=>v!==0) && !canMove()){ draw('<div class="result-box" style="color:var(--bad)">Game Over</div>'); return; }
      draw();
    }
  }
  function canMove(){
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){ const v=grid[r*4+c]; if(c<3&&v===grid[r*4+c+1])return true; if(r<3&&v===grid[(r+1)*4+c])return true; }
    return false;
  }
  window._g2048Key = (e)=>{
    if(!currentPage.includes('g-2048')) return;
    if(e.key==='ArrowLeft') move('left'); else if(e.key==='ArrowRight') move('right'); else if(e.key==='ArrowUp') move('up'); else if(e.key==='ArrowDown') move('down');
  };
  document.removeEventListener('keydown', window._g2048KeyBound||(()=>{}));
  window._g2048KeyBound = window._g2048Key;
  document.addEventListener('keydown', window._g2048KeyBound);
  init(); draw();
};

TOOL_RENDERERS['g-snake'] = (el)=>{
  el.innerHTML = `
    <div class="stat-row"><div class="s"><b id="snkScore">0</b><span>Skor</span></div><div class="s"><b>${DB.get('gameScores',{})['g-snake']||0}</b><span>Rekor</span></div></div>

      <div></div><button class="btn secondary" id="snUp">⬆️</button><div></div>
      <button class="btn secondary" id="snLeft">⬅️</button><button class="btn secondary" id="snDown">⬇️</button><button class="btn secondary" id="snRight">➡️</button>
    </div>
    <button class="btn" id="snStart" style="margin-top:10px;">▶️ Mulai</button>
  `;
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const cell=15, cols=20, rows=20;
  let snake, dir, food, score, iv, playing=false;
  function init(){ snake=[{x:10,y:10}]; dir={x:1,y:0}; placeFood(); score=0; document.getElementById('snkScore').textContent=0; }
  function placeFood(){ food={x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)}; }
  function draw(){
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--surface2') || '#1d2233'; ctx.fillRect(0,0,300,300);
    ctx.fillStyle = '#f87171'; ctx.fillRect(food.x*cell, food.y*cell, cell-1, cell-1);
    snake.forEach((s,i)=>{ ctx.fillStyle = i===0? '#f2a541':'#4ade80'; ctx.fillRect(s.x*cell,s.y*cell,cell-1,cell-1); });
  }
  function step(){
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=cols||head.y>=rows || snake.some(s=>s.x===head.x&&s.y===head.y)){
      clearInterval(iv); playing=false;
      const isBest = saveHighscore('g-snake', score);
      if(score>0) recordGameWin();
      addXP(Math.min(20,score),'Snake selesai');
      toast('💀 Game Over! Skor: '+score+(isBest?' 🏆 Rekor baru!':''));
      return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){ score++; document.getElementById('snkScore').textContent=score; placeFood(); }
    else snake.pop();
    draw();
  }
  document.getElementById('snStart').onclick = ()=>{
    if(playing) return; init(); playing=true; draw();
    clearInterval(iv); iv = setInterval(step, 160);
  };
  function setDir(x,y){ if(dir.x===-x&&dir.y===-y) return; dir={x,y}; }
  document.getElementById('snUp').onclick = ()=>setDir(0,-1);
  document.getElementById('snDown').onclick = ()=>setDir(0,1);
  document.getElementById('snLeft').onclick = ()=>setDir(-1,0);
  document.getElementById('snRight').onclick = ()=>setDir(1,0);
  document.removeEventListener('keydown', window._snakeKeyBound||(()=>{}));
  window._snakeKeyBound = (e)=>{
    if(!currentPage.includes('g-snake')) return;
    if(e.key==='ArrowUp') setDir(0,-1); else if(e.key==='ArrowDown') setDir(0,1); else if(e.key==='ArrowLeft') setDir(-1,0); else if(e.key==='ArrowRight') setDir(1,0);
  };
  document.addEventListener('keydown', window._snakeKeyBound);
  init(); draw();
};

/* Sliding Puzzle */
TOOL_RENDERERS['g-sliding'] = (el)=>{
  let tiles, moves;
  function init(){
    tiles = [...Array(15).keys()].map(n=>n+1); tiles.push(0);
    for(let i=0;i<200;i++){
      const empty = tiles.indexOf(0);
      const r=Math.floor(empty/4), c=empty%4;
      const options=[];
      if(r>0) options.push(empty-4); if(r<3) options.push(empty+4); if(c>0) options.push(empty-1); if(c<3) options.push(empty+1);
      const swap = options[Math.floor(Math.random()*options.length)];
      [tiles[empty],tiles[swap]]=[tiles[swap],tiles[empty]];
    }
    moves=0;
  }
  function isSolved(){ return tiles.every((v,i)=> i===15? v===0 : v===i+1); }
  function draw(){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${moves}</b><span>Langkah</span></div></div>
      ${isSolved()? '<div class="result-box" style="color:var(--good)">🎉 Selesai!</div>':''}
      <div class="puzzle-board">${tiles.map((v,i)=>`<div class="puzzle-cell ${v===0?'empty':''}" data-i="${i}">${v||''}</div>`).join('')}</div>
      <button class="btn secondary" id="pzReset" style="margin-top:10px;">🔄 Acak Ulang</button>
    `;
    document.querySelectorAll('.puzzle-cell').forEach(c=>c.onclick=()=>{
      const i = parseInt(c.dataset.i);
      const empty = tiles.indexOf(0);
      const r1=Math.floor(i/4),c1=i%4, r2=Math.floor(empty/4),c2=empty%4;
      if(Math.abs(r1-r2)+Math.abs(c1-c2)===1){
        [tiles[i],tiles[empty]]=[tiles[empty],tiles[i]]; moves++;
        if(isSolved()){ recordGameWin(); saveHighscore('g-sliding',moves,false); addXP(15,'Sliding Puzzle selesai'); }
        draw();
      }
    });
    document.getElementById('pzReset').onclick = ()=>{ init(); draw(); };
  }
  init(); draw();
};

/* -- Minesweeper mini 8x8 -- */
TOOL_RENDERERS['g-minesweeper'] = (el)=>{
  const SIZE=8, MINES=10;
  let board, revealed, flagged, over, won;
  function init(){
    board = Array(SIZE*SIZE).fill(0);
    revealed = Array(SIZE*SIZE).fill(false);
    flagged = Array(SIZE*SIZE).fill(false);
    over=false; won=false;
    let placed=0;
    while(placed<MINES){
      const i = Math.floor(Math.random()*SIZE*SIZE);
      if(board[i]===-1) continue;
      board[i]=-1; placed++;
    }
    for(let i=0;i<SIZE*SIZE;i++){
      if(board[i]===-1) continue;
      let n=0;
      const r=Math.floor(i/SIZE), c=i%SIZE;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr*SIZE+nc]===-1) n++;
      }
      board[i]=n;
    }
  }
  function flood(i){
    if(revealed[i]||flagged[i]||board[i]===-1) return;
    revealed[i]=true;
    if(board[i]===0){
      const r=Math.floor(i/SIZE), c=i%SIZE;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE) flood(nr*SIZE+nc);
      }
    }
  }
  function checkWin(){
    const safe = board.filter(v=>v!==-1).length;
    const opened = revealed.filter(Boolean).length;
    if(opened>=safe){ won=true; over=true; recordGameWin(); addXP(15,'Minesweeper selesai'); }
  }
  function draw(){
    const left = MINES - flagged.filter(Boolean).length;
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b>${left}</b><span>Ranjau</span></div><div class="s"><b>${SIZE}×${SIZE}</b><span>Papan</span></div></div>
      ${over? (won?'<div class="result-box" style="color:var(--good)">🎉 Semua aman! Menang.</div>':'<div class="result-box" style="color:var(--bad)">💥 Kena ranjau! Game over.</div>') : ''}
      <div style="display:grid;grid-template-columns:repeat(${SIZE},1fr);gap:3px;max-width:320px;margin:10px auto;">
        ${board.map((v,i)=>{
          let bg='var(--surface2)', txt='', content='';
          if(revealed[i]||(over&&v===-1)){
            if(v===-1){ content='💣'; bg='rgba(248,113,113,.25)'; }
            else { content=v||''; bg='var(--surface3)'; txt=v?'var(--accent)':'var(--muted)'; }
          } else if(flagged[i]){ content='🚩'; }
          return `<div data-i="${i}" style="aspect-ratio:1;background:${bg};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:${txt};cursor:pointer;user-select:none;">${content}</div>`;
        }).join('')}
      </div>
      <p class="small-note">Ketuk = buka · Tahan lama / kanan-klik = pasang bendera</p>
      <button class="btn secondary" id="msReset" style="margin-top:8px;">🔄 Main Lagi</button>
    `;
    const cells = el.querySelectorAll('[data-i]');
    cells.forEach(cell=>{
      const i = parseInt(cell.dataset.i);
      cell.onclick = ()=>{
        if(over||flagged[i]||revealed[i]) return;
        if(board[i]===-1){ revealed[i]=true; over=true; draw(); return; }
        flood(i); checkWin(); draw();
      };
      cell.oncontextmenu = (e)=>{
        e.preventDefault();
        if(over||revealed[i]) return;
        flagged[i]=!flagged[i]; draw();
      };
      let pressTimer;
      cell.ontouchstart = ()=>{ pressTimer=setTimeout(()=>{ if(!over&&!revealed[i]){ flagged[i]=!flagged[i]; draw(); } }, 450); };
      cell.ontouchend = ()=> clearTimeout(pressTimer);
      cell.ontouchmove = ()=> clearTimeout(pressTimer);
    });
    document.getElementById('msReset').onclick = ()=>{ init(); draw(); };
  }
  init(); draw();
};

/* -- Connect Four -- */
TOOL_RENDERERS['g-connect4'] = (el)=>{
  const ROWS=6, COLS=7;
  let grid, turn, over;
  function init(){ grid=Array(ROWS*COLS).fill(0); turn=1; over=false; }
  function drop(col, player){
    for(let r=ROWS-1;r>=0;r--){
      const i=r*COLS+col;
      if(grid[i]===0){ grid[i]=player; return i; }
    }
    return -1;
  }
  function checkWin(player){
    for(let r=0;r<ROWS;r++) for(let c=0;c<=COLS-4;c++){
      if([0,1,2,3].every(k=>grid[r*COLS+c+k]===player)) return true;
    }
    for(let c=0;c<COLS;c++) for(let r=0;r<=ROWS-4;r++){
      if([0,1,2,3].every(k=>grid[(r+k)*COLS+c]===player)) return true;
    }
    for(let r=0;r<=ROWS-4;r++) for(let c=0;c<=COLS-4;c++){
      if([0,1,2,3].every(k=>grid[(r+k)*COLS+c+k]===player)) return true;
    }
    for(let r=3;r<ROWS;r++) for(let c=0;c<=COLS-4;c++){
      if([0,1,2,3].every(k=>grid[(r-k)*COLS+c+k]===player)) return true;
    }
    return false;
  }
  function aiMove(){
    for(let c=0;c<COLS;c++){
      const tmp=[...grid]; if(drop(c,2)>=0){ if(checkWin(2)){ grid=tmp; drop(c,2); return; } grid=tmp; }
    }
    for(let c=0;c<COLS;c++){
      const tmp=[...grid]; if(drop(c,1)>=0){ if(checkWin(1)){ grid=tmp; drop(c,2); return; } grid=tmp; }
    }
    const free=[];
    for(let c=0;c<COLS;c++) if(grid[c]===0) free.push(c);
    if(free.length) drop(free[Math.floor(Math.random()*free.length)], 2);
  }
  function draw(msg){
    el.innerHTML = `
      <div class="stat-row"><div class="s"><b style="color:#f87171;">🔴</b><span>Kamu</span></div><div class="s"><b style="color:#facc15;">🟡</b><span>Komputer</span></div></div>
      ${msg||''}
      <div style="display:grid;grid-template-columns:repeat(${COLS},1fr);gap:4px;max-width:320px;margin:10px auto;">
        ${Array(COLS).fill(0).map((_,c)=>`<button class="btn secondary sm" data-c="${c}" ${over?'disabled':''} style="padding:6px 0;">▼</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(${COLS},1fr);gap:4px;max-width:320px;margin:0 auto;background:var(--surface2);padding:8px;border-radius:14px;">
        ${grid.map(v=>{
          const color = v===1?'#f87171':v===2?'#facc15':'var(--surface3)';
          return `<div style="aspect-ratio:1;border-radius:50%;background:${color};"></div>`;
        }).join('')}
      </div>
      <button class="btn secondary" id="c4Reset" style="margin-top:12px;">🔄 Main Lagi</button>
    `;
    el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      if(over||turn!==1) return;
      const col = parseInt(b.dataset.c);
      if(grid[col]!==0) return toast('Kolom penuh');
      drop(col,1);
      if(checkWin(1)){ over=true; recordGameWin(); addXP(10,'Menang Connect Four'); draw('<div class="result-box" style="color:var(--good)">🎉 Kamu menang!</div>'); return; }
      if(grid.every(v=>v!==0)){ over=true; draw('<div class="result-box">🤝 Seri!</div>'); return; }
      turn=2; draw();
      setTimeout(()=>{
        aiMove();
        if(checkWin(2)){ over=true; draw('<div class="result-box" style="color:var(--bad)">😢 Komputer menang!</div>'); return; }
        if(grid.every(v=>v!==0)){ over=true; draw('<div class="result-box">🤝 Seri!</div>'); return; }
        turn=1; draw();
      }, 350);
    });
    document.getElementById('c4Reset').onclick = ()=>{ init(); draw(); };
  }
  init(); draw();
};

/* -- Catch Fruits -- */
TOOL_RENDERERS['g-catch'] = (el)=>{
  el.innerHTML = `
    <div class="stat-row"><div class="s"><b id="cfScore">0</b><span>Skor</span></div><div class="s"><b id="cfLives">3</b><span>Nyawa</span></div></div>
    <canvas id="catchCanvas" width="320" height="400" style="width:100%;max-width:320px;display:block;margin:0 auto;background:var(--surface2);border-radius:14px;touch-action:none;"></canvas>
    <button class="btn" id="cfStart" style="margin-top:12px;">▶️ Mulai</button>
    <p class="small-note">Geser paddle kiri-kanan (mouse/touch). Tangkap buah 🍎🍊🍇, hindari bom 💣.</p>
  `;
  const canvas = document.getElementById('catchCanvas');
  const ctx = canvas.getContext('2d');
  let score=0, lives=3, items=[], paddle={x:120,w:80,h:14}, playing=false, raf=null, lastSpawn=0;
  const fruits = ['🍎','🍊','🍇','🍓','🍌'];
  function spawn(){
    const isBomb = Math.random() < 0.22;
    items.push({
      x: Math.random()*(canvas.width-30)+5,
      y: -30,
      vy: 2.2 + Math.random()*2.5 + score*0.05,
      emoji: isBomb ? '💣' : fruits[Math.floor(Math.random()*fruits.length)],
      bomb: isBomb,
      size: 26
    });
  }
  function loop(ts){
    if(!playing) return;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface2').trim() || '#1d2233';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#f2a541';
    ctx.fillRect(paddle.x, canvas.height-28, paddle.w, paddle.h);
    if(ts - lastSpawn > Math.max(400, 900 - score*8)){ spawn(); lastSpawn = ts; }
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      it.y += it.vy;
      ctx.font = it.size+'px serif';
      ctx.fillText(it.emoji, it.x, it.y);
      if(it.y > canvas.height-40 && it.y < canvas.height-10 && it.x+20 > paddle.x && it.x < paddle.x+paddle.w){
        if(it.bomb){ lives--; document.getElementById('cfLives').textContent=lives; if(navigator.vibrate) navigator.vibrate(40); }
        else { score++; document.getElementById('cfScore').textContent=score; addXP(1); }
        items.splice(i,1);
        if(lives<=0){ endGame(); return; }
        continue;
      }
      if(it.y > canvas.height+20){
        if(!it.bomb){ lives--; document.getElementById('cfLives').textContent=lives; }
        items.splice(i,1);
        if(lives<=0){ endGame(); return; }
      }
    }
    raf = requestAnimationFrame(loop);
  }
  function endGame(){
    playing=false;
    cancelAnimationFrame(raf);
    saveHighscore('g-catch', score);
    if(score>0) recordGameWin();
    addXP(Math.min(20,score),'Catch Fruits selesai');
    toast('💀 Game Over! Skor: '+score);
    document.getElementById('cfStart').style.display='block';
  }
  function movePaddle(clientX){
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, x - paddle.w/2));
  }
  canvas.addEventListener('mousemove', e=> movePaddle(e.clientX));
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive:false});
  document.getElementById('cfStart').onclick = ()=>{
    score=0; lives=3; items=[]; playing=true; lastSpawn=0;
    document.getElementById('cfScore').textContent=0;
    document.getElementById('cfLives').textContent=3;
    document.getElementById('cfStart').style.display='none';
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  };
};

/* -- Breakout -- */
TOOL_RENDERERS['g-breakout'] = (el)=>{
  el.innerHTML = `
    <div class="stat-row"><div class="s"><b id="boScore">0</b><span>Skor</span></div><div class="s"><b id="boLives">3</b><span>Nyawa</span></div></div>
    <canvas id="boCanvas" width="320" height="420" style="width:100%;max-width:320px;display:block;margin:0 auto;background:var(--surface2);border-radius:14px;touch-action:none;"></canvas>
    <button class="btn" id="boStart" style="margin-top:12px;">▶️ Mulai</button>
    <p class="small-note">Geser paddle. Hancurkan semua bata. Bola memantul otomatis.</p>
  `;
  const canvas = document.getElementById('boCanvas');
  const ctx = canvas.getContext('2d');
  let score=0, lives=3, bricks=[], ball, paddle, playing=false, raf=null;
  const rows=5, cols=8, bw=36, bh=14, gap=4, offsetTop=40, offsetLeft=8;
  function initBricks(){
    bricks=[];
    const palette = ['#f87171','#fb923c','#facc15','#4ade80','#60a5fa'];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      bricks.push({x: offsetLeft + c*(bw+gap), y: offsetTop + r*(bh+gap), w:bw, h:bh, alive:true, color:palette[r]});
    }
  }
  function resetBall(){
    ball = {x:160, y:300, vx: 2.4*(Math.random()>.5?1:-1), vy:-3.2, r:7};
    paddle = {x:120, w:70, h:12};
  }
  function loop(){
    if(!playing) return;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface2').trim() || '#1d2233';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    bricks.forEach(b=>{
      if(!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#f2a541';
    ctx.fillRect(paddle.x, canvas.height-24, paddle.w, paddle.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ball.x += ball.vx; ball.y += ball.vy;
    if(ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.vx *= -1;
    if(ball.y - ball.r < 0) ball.vy *= -1;
    if(ball.y + ball.r > canvas.height-24 && ball.y - ball.r < canvas.height-12 &&
       ball.x > paddle.x && ball.x < paddle.x + paddle.w){
      ball.vy = -Math.abs(ball.vy);
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      ball.vx = hit * 3.5;
    }
    for(const b of bricks){
      if(!b.alive) continue;
      if(ball.x + ball.r > b.x && ball.x - ball.r < b.x+b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y+b.h){
        b.alive = false; ball.vy *= -1; score += 10;
        document.getElementById('boScore').textContent = score;
        addXP(1);
        break;
      }
    }
    if(ball.y - ball.r > canvas.height){
      lives--; document.getElementById('boLives').textContent = lives;
      if(lives<=0){ endGame(); return; }
      resetBall();
    }
    if(bricks.every(b=>!b.alive)){
      score += 50; document.getElementById('boScore').textContent = score;
      initBricks();
      ball.vx *= 1.08; ball.vy *= 1.08;
      resetBall();
      toast('🎉 Level clear! +50');
    }
    raf = requestAnimationFrame(loop);
  }
  function endGame(){
    playing=false; cancelAnimationFrame(raf);
    saveHighscore('g-breakout', score);
    if(score>0) recordGameWin();
    addXP(Math.min(25, Math.floor(score/10)), 'Breakout selesai');
    toast('💀 Game Over! Skor: '+score);
    document.getElementById('boStart').style.display='block';
  }
  function movePaddle(clientX){
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, x - paddle.w/2));
  }
  canvas.addEventListener('mousemove', e=> playing && movePaddle(e.clientX));
  canvas.addEventListener('touchmove', e=>{ if(!playing) return; e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive:false});
  document.getElementById('boStart').onclick = ()=>{
    score=0; lives=3; playing=true;
    document.getElementById('boScore').textContent=0;
    document.getElementById('boLives').textContent=3;
    document.getElementById('boStart').style.display='none';
    initBricks(); resetBall();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  };
};

/* -- Terbang Seru (flappy-style) -- */
TOOL_RENDERERS['g-terbang'] = (el)=>{
  const best0 = DB.get('gameScores',{})['g-terbang']||0;
  el.innerHTML = `
    <div class="tsb-wrap" id="tsbWrap">
      <canvas id="tsbCanvas"></canvas>
      <div class="tsb-hud"><div class="tsb-score" id="tsbScore">0</div><div class="tsb-best" id="tsbBest">🏆 ${best0}</div></div>
      <div class="tsb-hint" id="tsbHint">Ketuk untuk terbang</div>
      <div class="tsb-overlay" id="tsbOverlay">
        <div class="em">🐤</div>
        <h3 id="tsbTitle">Terbang Seru</h3>
        <p>Ketuk untuk terbang melewati celah pipa sebanyak mungkin. Jangan sampai menabrak!</p>
        <div class="stat-row"><div class="s"><b id="tsbLast">0</b><span>Terakhir</span></div><div class="s"><b id="tsbBestStat">${best0}</b><span>Rekor</span></div></div>
        <button class="tsb-play" id="tsbPlay">▶ Main</button>
      </div>
    </div>
  `;
  const wrapEl = document.getElementById('tsbWrap');
  const canvas = document.getElementById('tsbCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('tsbOverlay');
  const scoreEl = document.getElementById('tsbScore');
  const bestEl = document.getElementById('tsbBest');
  const lastEl = document.getElementById('tsbLast');
  const bestStatEl = document.getElementById('tsbBestStat');
  const hintEl = document.getElementById('tsbHint');
  const playBtn = document.getElementById('tsbPlay');

  let W, H, DPR;
  function resize(){
    const rect = wrapEl.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width || 300; H = rect.height || 420;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  const onResize = ()=>resize();
  window.addEventListener('resize', onResize);

  const GRAV=1500, FLAP_V=-420, PIPE_GAP_BASE=190, PIPE_W=60, BIRD_R=14;
  let bird, pipes, score, speed, playing, over, spawnTimer, clouds, groundOffset, animT, raf, last;

  function reset(){
    bird = {x:W*0.3, y:H*0.4, vy:0, rot:0};
    pipes = []; score=0; speed=165; playing=false; over=false; spawnTimer=0; animT=0;
    scoreEl.textContent='0';
    clouds = Array.from({length:5},()=>({x:Math.random()*W, y:20+Math.random()*H*0.4, s:.5+Math.random()*.8}));
    groundOffset=0;
  }
  function flap(){
    if(over) return;
    if(!playing){ playing=true; overlay.classList.add('hide'); hintEl.style.opacity='1'; }
    bird.vy = FLAP_V;
  }
  function spawnPipe(){
    const gap = Math.max(125, PIPE_GAP_BASE - Math.min(50, score*1.5));
    const margin = 55;
    const top = margin + Math.random()*(H - margin*2 - gap - 80);
    pipes.push({x:W+PIPE_W, top, gap, passed:false});
  }
  function endGame(){
    over=true; playing=false;
    lastEl.textContent = score;
    const isBest = saveHighscore('g-terbang', score, true);
    if(score>0) recordGameWin();
    addXP(Math.min(20,score*2),'Terbang Seru selesai');
    const best = DB.get('gameScores',{})['g-terbang']||0;
    bestEl.textContent = '🏆 '+best; bestStatEl.textContent = best;
    document.getElementById('tsbTitle').textContent = isBest && score>0 ? 'Rekor Baru!' : 'Coba Lagi!';
    overlay.querySelector('.em').textContent = isBest && score>0 ? '🏆' : '💥';
    playBtn.textContent = '🔄 Main Lagi';
    overlay.classList.remove('hide');
    if(isBest && score>0) toast('🏆 Rekor baru: '+score);
  }
  function update(dt){
    animT += dt;
    clouds.forEach(cl=>{ cl.x -= dt*10*cl.s; if(cl.x<-40) cl.x = W+40; });
    if(!playing) return;
    bird.vy += GRAV*dt; bird.y += bird.vy*dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy/500));
    groundOffset -= speed*dt;
    speed = Math.min(320, 165+score*4);
    spawnTimer -= dt;
    if(spawnTimer<=0){ spawnPipe(); spawnTimer = Math.max(1.15, 1.7-score*0.02); }
    pipes.forEach(p=> p.x -= speed*dt);
    pipes = pipes.filter(p=> p.x > -PIPE_W-10);
    pipes.forEach(p=>{
      if(!p.passed && p.x+PIPE_W < bird.x-BIRD_R){ p.passed=true; score++; scoreEl.textContent=score; }
      const withinX = bird.x+BIRD_R > p.x && bird.x-BIRD_R < p.x+PIPE_W;
      if(withinX && (bird.y-BIRD_R < p.top || bird.y+BIRD_R > p.top+p.gap)) endGame();
    });
    const groundY = H-40;
    if(bird.y+BIRD_R > groundY || bird.y-BIRD_R < 0) endGame();
  }
  function drawBg(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#6ec6ff'); g.addColorStop(.65,'#bfe8ff'); g.addColorStop(1,'#e9fbe5');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.85)';
    clouds.forEach(cl=>{
      ctx.beginPath();
      ctx.ellipse(cl.x,cl.y,26*cl.s,14*cl.s,0,0,Math.PI*2);
      ctx.ellipse(cl.x+18*cl.s,cl.y+4*cl.s,18*cl.s,11*cl.s,0,0,Math.PI*2);
      ctx.ellipse(cl.x-16*cl.s,cl.y+5*cl.s,16*cl.s,10*cl.s,0,0,Math.PI*2);
      ctx.fill();
    });
  }
  function drawPipe(p){
    const bg = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    bg.addColorStop(0,'#3fae4a'); bg.addColorStop(.5,'#5fd66c'); bg.addColorStop(1,'#3fae4a');
    ctx.fillStyle=bg;
    ctx.fillRect(p.x,0,PIPE_W,p.top);
    ctx.fillRect(p.x,p.top+p.gap,PIPE_W,H-(p.top+p.gap));
    ctx.fillStyle='#2f8f3a';
    ctx.fillRect(p.x-4,p.top-20,PIPE_W+8,20);
    ctx.fillRect(p.x-4,p.top+p.gap,PIPE_W+8,20);
  }
  function drawGround(){
    const groundY = H-40;
    ctx.fillStyle='#deb887'; ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle='#8bc24a'; ctx.fillRect(0,groundY,W,7);
    ctx.fillStyle='rgba(0,0,0,.08)';
    const tile=28; let off=((groundOffset%tile)+tile)%tile;
    for(let x=-off;x<W;x+=tile) ctx.fillRect(x,groundY+7,tile*0.5,H-groundY-7);
  }
  function drawBird(){
    ctx.save(); ctx.translate(bird.x,bird.y); ctx.rotate(bird.rot);
    const wingY = Math.sin(animT*16)*4;
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.ellipse(0,0,BIRD_R,BIRD_R*0.86,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f4a53c'; ctx.beginPath(); ctx.ellipse(-2,4+wingY,8,5.5,-0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6,-4,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1c1d22'; ctx.beginPath(); ctx.arc(7.5,-4,1.9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff8c42'; ctx.beginPath(); ctx.moveTo(11,-1); ctx.lineTo(19,2); ctx.lineTo(11,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function loop(now){
    if(!currentPage.includes('g-terbang')){ cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); return; }
    const dt = Math.min(0.033,(now-last)/1000); last=now;
    update(dt); drawBg(); pipes.forEach(drawPipe); drawGround(); drawBird();
    raf = requestAnimationFrame(loop);
  }
  canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); flap(); });
  if(window._tsbKeyBound) document.removeEventListener('keydown', window._tsbKeyBound);
  window._tsbKeyBound = (e)=>{ if(!currentPage.includes('g-terbang')) return; if(e.code==='Space'){ e.preventDefault(); flap(); } };
  document.addEventListener('keydown', window._tsbKeyBound);
  playBtn.addEventListener('click', e=>{ e.stopPropagation(); reset(); overlay.classList.add('hide'); hintEl.style.opacity='1'; });

  reset();
  last = performance.now();
  raf = requestAnimationFrame(loop);
};

TOOL_RENDERERS['color-picker'] = (el)=>{
  function hexToRgb(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `${r}, ${g}, ${b}`; }
  function hexToHsl(hex){
    let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b); let h,s,l=(max+min)/2;
    if(max===min){h=s=0;} else { const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;} h/=6; }
    return `${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%`;
  }
  function draw(hex){
    el.innerHTML = `
      <div class="color-swatch" style="background:${hex};"></div>
      <div class="card"><input type="color" id="cpInput" value="${hex}"></div>
      <div class="grid2">
        <div class="result-box"><div class="big" style="font-size:16px;">${hex.toUpperCase()}</div><div class="lbl">HEX</div></div>
        <div class="result-box"><div class="big" style="font-size:14px;">${hexToRgb(hex)}</div><div class="lbl">RGB</div></div>
      </div>
      <div class="result-box"><div class="big" style="font-size:14px;">${hexToHsl(hex)}</div><div class="lbl">HSL</div></div>
      <button class="btn secondary" style="margin-top:10px;" onclick="copyText('${hex}')">📋 Salin HEX</button>
    `;
    document.getElementById('cpInput').oninput = e=> draw(e.target.value);
  }
  draw('#f2a541');
};

TOOL_RENDERERS['drawing-pad'] = (el)=>{
  el.innerHTML = `
    <canvas id="drawCanvas" width="500" height="380"></canvas>
    <div class="row" style="margin-top:10px;">
      <input type="color" id="drColor" value="#f2a541" style="flex:1;">
      <input type="range" id="drSize" min="1" max="30" value="5" style="flex:2;">
    </div>
    <button class="btn secondary" id="drClear" style="margin-top:10px;">🗑️ Bersihkan Kanvas</button>
  `;
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,canvas.width,canvas.height);
  let drawing=false;
  function pos(e){ const r=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:x*canvas.width/r.width, y:y*canvas.height/r.height}; }
  function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle=document.getElementById('drColor').value; ctx.lineWidth=document.getElementById('drSize').value; ctx.lineCap='round'; ctx.stroke(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start,{passive:true}); canvas.addEventListener('touchmove', move,{passive:false}); canvas.addEventListener('touchend', end);
  document.getElementById('drClear').onclick = ()=>{ ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,canvas.width,canvas.height); };
};

  el.innerHTML = `<div class="piano">${notes.map((f,i)=>`<div class="piano-key" data-f="${f}">${labels[i]}</div>`).join('')}</div><p class="small-note">Ketuk tuts untuk memainkan nada.</p>`;
  let ctx;
  el.querySelectorAll('.piano-key').forEach(k=>k.addEventListener('touchstart',(e)=>{e.preventDefault();playNote(parseFloat(k.dataset.f));},{passive:false}));
  el.querySelectorAll('.piano-key').forEach(k=>k.addEventListener('mousedown',()=>playNote(parseFloat(k.dataset.f))));
  function playNote(freq){
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=freq; o.type='sine'; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.25,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+0.8);
    o.start(); o.stop(ctx.currentTime+0.8);
  }
};

/* ============================================================
   GAME EMBED: TURBO DERBY, HUTAN PETUALANGAN, MATCH PERMATA
   Menggunakan iframe srcdoc (bukan data: URL) supaya iframe
   berbagi origin dengan halaman ini.
   Progres game DISIMPAN OLEH HALAMAN INI (bukan oleh iframe),
   karena localStorage di dalam iframe srcdoc tidak selalu
   persisten di semua browser/HP (terutama saat file dibuka
   lewat file:// di HP). Game di dalam iframe mengirim pesan
   (postMessage) ke halaman ini setiap mau baca/simpan data,
   dan halaman ini yang benar-benar menulis ke localStorage.
   ============================================================ */
const EMBED_STORAGE_PFX = 'sann_game_';
const EMBED_GAME_IDS = ['g-turbo-derby','g-hutan-petualangan','g-match-permata','g-bola-gacor','g-bola-duel'];
/* Koleksi Firestore khusus untuk data "shared" (mis. room mabar Bola Duel).
   Data shared=true TIDAK BOLEH disimpan di localStorage, karena localStorage
   cuma ada di 1 HP/browser — HP lain tidak akan pernah bisa membacanya.
   Makanya room mabar dulu selalu gagal connect: kode room tersimpan di HP
   pembuat room saja, HP yang join tidak bisa melihatnya sama sekali. */
const EMBED_SHARED_COLLECTION = 'embedSharedStorage';
function embedSharedDocId(gameId, key){
  return (gameId + '__' + (key||'')).replace(/[\/\s]/g, '_').slice(0, 400);
}
window.addEventListener('message', async function(ev){
  const d = ev.data;
  if(!d || d.__sannStorageRequest !== true) return;
  if(!EMBED_GAME_IDS.includes(d.gameId)) return;
  const nsPrefix = EMBED_STORAGE_PFX + d.gameId + '_';
  const fullKey = nsPrefix + d.key;
  const shared = !!d.shared;
  let result = null, error = null;
  try{
    if(shared){
      const docId = embedSharedDocId(d.gameId, d.key);
      if(d.action === 'get'){
        const snap = await db.collection(EMBED_SHARED_COLLECTION).doc(docId).get();
        if(!snap.exists) throw new Error('key not found: ' + d.key);
        result = { key: d.key, value: snap.data().value, shared: true };
      } else if(d.action === 'set'){
        await db.collection(EMBED_SHARED_COLLECTION).doc(docId).set({
          gameId: d.gameId,
          key: d.key,
          value: d.value,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        result = { key: d.key, value: d.value, shared: true };
      } else if(d.action === 'delete'){
        await db.collection(EMBED_SHARED_COLLECTION).doc(docId).delete();
        result = { key: d.key, deleted: true, shared: true };
      } else if(d.action === 'list'){
        const snap = await db.collection(EMBED_SHARED_COLLECTION)
          .where('gameId', '==', d.gameId).get();
        const pfx = d.key || '';
        const keys = [];
        snap.forEach(doc=>{
          const k = doc.data().key;
          if(typeof k === 'string' && k.indexOf(pfx) === 0) keys.push(k);
        });
        result = { keys, prefix: d.key, shared: true };
      } else {
        throw new Error('unknown action: ' + d.action);
      }
    } else {
      if(d.action === 'get'){
        const raw = localStorage.getItem(fullKey);
        if(raw === null) throw new Error('key not found: ' + d.key);
        result = { key: d.key, value: raw, shared: false };
      } else if(d.action === 'set'){
        localStorage.setItem(fullKey, d.value);
        result = { key: d.key, value: d.value, shared: false };
      } else if(d.action === 'delete'){
        localStorage.removeItem(fullKey);
        result = { key: d.key, deleted: true, shared: false };
      } else if(d.action === 'list'){
        const keys = [];
        const full = nsPrefix + (d.key||'');
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(full)===0) keys.push(k.slice(nsPrefix.length));
        }
        result = { keys, prefix: d.key, shared: false };
      } else {
        throw new Error('unknown action: ' + d.action);
      }
    }
  }catch(e){ error = (e && e.message) || String(e); }
  if(ev.source){
    ev.source.postMessage({ __sannStorageReply: true, reqId: d.reqId, result, error }, '*');
  }

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function renderEmbedGame(el, gid){
  el.innerHTML = `
    <div class="embed-game-wrap" id="egwrap-${gid}">
      <iframe class="embed-game-frame" id="egf-${gid}" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>
      <button class="embed-fs-close" id="egfsclose-${gid}" title="Keluar layar penuh">✕</button>
    </div>
    <div class="embed-game-actions">
      <button class="btn secondary" id="egfull-${gid}">⛶ Layar Penuh</button>
      <button class="btn ghost" id="egreload-${gid}">↻ Muat Ulang</button>
    </div>
    <p class="small-note">Progres game ini tersimpan otomatis di perangkatmu — kalau keluar lalu balik lagi, tinggal lanjut, tidak mulai dari awal.</p>
  `;
  const wrap = document.getElementById('egwrap-'+gid);
  const frame = document.getElementById('egf-'+gid);
  const fullBtn = document.getElementById('egfull-'+gid);
  const reloadBtn = document.getElementById('egreload-'+gid);
  const closeBtn = document.getElementById('egfsclose-'+gid);
  function load(){ frame.srcdoc = b64ToUtf8(EMBED_GAME_B64[gid]); }
  load();
  function doExitFullscreen(){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if(document.webkitCancelFullScreen) document.webkitCancelFullScreen();
  }
  // Fullscreen-kan WRAPPER (bukan iframe langsung) supaya tombol ✕ ikut
  // tampil di atas game saat mode layar penuh aktif.
  fullBtn.onclick = ()=>{
    if(wrap.requestFullscreen) wrap.requestFullscreen();
    else if(wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    else toast('Fullscreen tidak didukung di browser ini');
  };
  closeBtn.onclick = doExitFullscreen;
  reloadBtn.onclick = load;
}

/* ============================================================
   DOWNLOAD VIDEO TIKTOK
   ============================================================ */
TOOL_RENDERERS['downloader-video'] = (el)=>{

  function draw(){
    el.innerHTML = `
      <div class="card">
        <div class="field">
          <label>Link Video TikTok</label>
          <input type="text" id="vdlInput" placeholder="Tempel link video TikTok di sini..." autocomplete="off">
        </div>
        <button class="btn" id="vdlBtn">⬇️ Ambil & Unduh Video</button>
        <div class="vdl-platform-note"><span>ℹ️</span><span>Video TikTok diproses langsung di dalam tools ini (tanpa watermark).</span></div>
      </div>
      <div id="vdlResult"></div>
      <p class="small-note">Gunakan hanya untuk video yang kamu punya izin untuk diunduh (video sendiri atau yang diizinkan pemiliknya). Hormati hak cipta dan ketentuan layanan TikTok.</p>
    `;
    document.getElementById('vdlBtn').onclick = ()=> handleSubmit();
    document.getElementById('vdlInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleSubmit(); });
  }

  async function handleSubmit(){
    const input = document.getElementById('vdlInput');
    const link = (input.value||'').trim();
    const resBox = document.getElementById('vdlResult');
    if(!link){ toast('Tempel link dulu ya'); return; }
    if(!/^https?:\/\//i.test(link)){ toast('Link tidak valid'); return; }

    resBox.innerHTML = `<div class="result-box"><div class="lbl">Memproses video, tunggu sebentar...</div></div>`;
    try{
      const api = 'https://www.tikwm.com/api/?url=' + encodeURIComponent(link) + '&hd=1';
      const r = await fetch(api, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data = await r.json();
      if(data.code !== 0 || !data.data || !(data.data.play || data.data.hdplay)) throw new Error(data.msg || 'Video tidak ditemukan');
      const d = data.data;
      const videoUrl = d.hdplay || d.play;
      resBox.innerHTML = `
        <video class="vdl-video" src="${videoUrl}" controls playsinline></video>
        <div class="vdl-meta">${d.title ? escapeHtml(d.title) : 'Tanpa judul'}${d.duration ? ' · '+d.duration+'s' : ''}</div>
        <div class="btn-row" style="margin-top:10px;">
          <a class="btn" href="${videoUrl}" target="_blank" rel="noopener">⬇️ Unduh Video</a>
          ${d.music ? `<a class="btn secondary" href="${d.music}" target="_blank" rel="noopener">🎵 Unduh Audio</a>` : ''}
        </div>
        <p class="small-note">Ketuk "Unduh Video" — video akan terbuka di tab baru, lalu tekan lama pada video (atau ikon unduh di browser) untuk menyimpannya ke penyimpanan HP.</p>
      `;
      addXP(2,'Unduh video TikTok');
    }catch(err){
      resBox.innerHTML = `
        <div class="empty-state"><span class="em">⚠️</span>Gagal mengambil video. Coba lagi atau pastikan link valid & video bersifat publik.<br><small>${escapeHtml(String(err && err.message || err))}</small></div>
      `;
    }
  }

  draw();
};
